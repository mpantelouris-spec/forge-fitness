function ask({title='',msg='',ok='OK',cancel='Cancel',danger=false,fields=null}){ return new Promise(res=>{
  const d=document.createElement('div'); d.className='modal dlg'; d.style.zIndex=90;
  d.innerHTML=`<div class="card" style="max-width:420px"><h3 style="margin-bottom:6px">${esc(title||msg)}</h3>${title&&msg?`<div class="mut" style="margin-bottom:12px">${esc(msg)}</div>`:'<div style="height:6px"></div>'}
   ${(fields||[]).map((f,i)=>`<label style="margin-bottom:10px">${esc(f.label||'')}<input data-i="${i}" type="${f.type||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" style="width:100%"></label>`).join('')}
   <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn g" data-a="0">${esc(cancel)}</button><button class="btn ${danger?'d':''}" data-a="1">${esc(ok)}</button></div></div>`;
  const done=v=>{ d.remove(); document.removeEventListener('keydown',key,true); res(v); };
  const val=()=>fields?[...d.querySelectorAll('input')].map(i=>i.value):true;
  const key=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(null);} if(e.key==='Enter'){ e.preventDefault(); done(val()); } };
  d.addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(a) done(a.dataset.a==='1'?val():null); else if(e.target===d) done(null); });
  document.addEventListener('keydown',key,true); document.body.appendChild(d); (d.querySelector('input')||d.querySelector('[data-a="1"]')).focus(); d.querySelector('input')?.select?.();
}); }
const askConfirm=(msg,o={})=>ask({msg,...o}).then(r=>!!r);
const askPrompt=(msg,value='',o={})=>ask({title:msg,fields:[{value,type:o.type}],...o}).then(r=>r?r[0]:null);

function foodMacros(f, g){ const m=g/100; return {kcal:f.k*m, p:f.p*m, c:f.c*m, f:f.f*m, fib:f.fib*m}; }
function sumM(arr){ return arr.reduce((a,x)=>({kcal:a.kcal+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),f:a.f+(x.f||0),fib:a.fib+(x.fib||0)}),{kcal:0,p:0,c:0,f:0,fib:0}); }
function recipeTotals(r){ const parts = r.ing.map(([id,g])=>{const f=foodById(id); return f?foodMacros(f,g):null}).filter(Boolean); const t=sumM(parts); t.grams=r.ing.reduce((a,[,g])=>a+g,0); return t; }
function recipePer(r){ const t=recipeTotals(r); const s=r.serv||1; return {kcal:t.kcal/s,p:t.p/s,c:t.c/s,f:t.f/s,fib:t.fib/s,grams:t.grams/s}; }

function sortedWeights(){ return [...S.weights].sort((a,b)=>a.date<b.date?-1:1); }
// Exponentially smoothed trend (10%/day), gap-aware — filters out water-weight noise
function weightTrend(){
  const ws = sortedWeights(); let t=null, prev=null; const out=[];
  for(const w of ws){ if(t===null) t=w.kg; else { const gap=Math.max(1,dnum(w.date)-dnum(prev)); const a=1-Math.pow(0.9,gap); t=t+a*(w.kg-t); } prev=w.date; out.push({date:w.date,kg:w.kg,trend:t}); }
  return out;
}
function currentWeight(){ const t=weightTrend(); return t.length ? t[t.length-1].trend : S.profile.weightKg; }
function linreg(pts){ const n=pts.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0; for(const[x,y] of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;} const d=n*sxx-sx*sx; if(!d) return null; const m=(n*sxy-sx*sy)/d; return {m, b:(sy-m*sx)/n}; }
function weeklyRate(days=21){ const end=dnum(TODAY()); const pts=sortedWeights().filter(w=>end-dnum(w.date)<=days).map(w=>[dnum(w.date),w.kg]); if(pts.length<3) return null; const span=pts[pts.length-1][0]-pts[0][0]; if(span<6) return null; const lr=linreg(pts); return lr? lr.m*7 : null; }
function bmrInfo(kg=currentWeight()){
  const p=S.profile;
  if(p.bodyFat>3 && p.bodyFat<60){ const lbm=kg*(1-p.bodyFat/100); return {bmr:370+21.6*lbm, method:'Katch-McArdle (uses lean mass)'}; }
  return {bmr:10*kg+6.25*p.heightCm-5*p.age+(p.sex==='male'?5:-161), method:'Mifflin-St Jeor'};
}
// Adaptive TDEE: energy balance from your own intake + weight trend (needs ≥14 days, ≥10 logged)
function adaptiveTDEE(){
  const end=TODAY(); const N=28; let kc=[], first=null;
  for(let i=1;i<=N;i++){ const d=addDays(end,-i); const L=S.log[d]; if(L && L.food && L.food.length){ const k=sumM(L.food).kcal; if(k>500){kc.push(k); first=d;} } }
  if(kc.length<10) return null;
  const startN=dnum(addDays(end,-N)); const pts=sortedWeights().filter(w=>dnum(w.date)>=startN).map(w=>[dnum(w.date),w.kg]);
  if(pts.length<5 || pts[pts.length-1][0]-pts[0][0]<14) return null;
  const lr=linreg(pts); const avg=kc.reduce((a,b)=>a+b,0)/kc.length;
  const tdee = avg - lr.m*KCAL_PER_KG;
  return {tdee, avgIntake:avg, days:kc.length, slopeWk:lr.m*7, confidence: kc.length>=21 && pts.length>=12 ? 'high' : 'moderate'};
}
function navyBF(sex,hCm,waist,neck,hip){
  if(sex==='male'){ if(waist<=neck) return null; return 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(hCm))-450; }
  if(!hip || waist+hip<=neck) return null; return 495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(hCm))-450;
}
function targets(){
  const p=S.profile, kg=currentWeight(); const bi=bmrInfo(kg); const formula=bi.bmr*p.activity;
  const ad=adaptiveTDEE(); const useAd = p.useAdaptive && ad; const tdee = useAd ? ad.tdee : formula;
  const delta = p.goal==='lose' ? -p.rate*KCAL_PER_KG/7 : p.goal==='gain' ? p.rate*KCAL_PER_KG/7 : 0;
  const floor = p.sex==='male'?1500:1200; let kcal = Math.max(floor, tdee+delta); const floored = tdee+delta<floor;
  const hM=p.heightCm/100, bmi=kg/(hM*hM);
  const refKg = bmi>30 ? 25*hM*hM : kg; // protein from adjusted weight if BMI>30
  const protein = p.proteinPerKg*refKg; const fat = Math.max(kcal*p.fatPct, 0.5*kg*9)/9;
  const carbs = Math.max(0,(kcal-protein*4-fat*9)/4);
  return {bmr:bi.bmr, method:bi.method, formula, ad, useAd, tdee, kcal, floored, delta, protein, fat, carbs, fiber:14*kcal/1000, water:35*kg, bmi, kg};
}
// Net exercise calories: subtracts your own resting rate so BMR isn't double-counted
function actKcal(met, min, kg=currentWeight()){
  const rmrMl = bmrInfo(kg).bmr/1440/5*1000/kg; // ml O2/kg/min (≈ individual 1 MET)
  const gross = met*3.5*kg*min*0.005; const net = Math.max(0,(met*3.5-rmrMl))*kg*min*0.005;
  return {gross, net};
}
// e1RM: avg of Epley & Brzycki ≤10 reps, Epley above; RPE adds reps-in-reserve
function e1rm(w,r,rpe){ if(!w||!r) return 0; let reps=r+(rpe? clamp(10-rpe,0,5):0); if(reps<=1) return w; return reps<=10 ? (w*(1+reps/30)+w*36/(37-reps))/2 : w*(1+reps/30); }

// ---------- Charts (hand-rolled SVG) ----------
function lineChart(series,{h=220,yfmt=v=>r1(v),xfmt=x=>x,W=640}={}){
  const all=series.flatMap(s=>s.pts); if(all.length<2) return '<div class="empty">Log at least two entries to see a chart</div>';
  const pl=46,pr=12,pt=12,pb=26; let xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs); if(x0===x1){x0-=1;x1+=1;}
  let y0=Math.min(...ys),y1=Math.max(...ys); const pad=(y1-y0)*0.12||1; y0-=pad; y1+=pad;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(h-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){ const v=y0+(y1-y0)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${yfmt(v)}</text>`; }
  for(let i=0;i<=4;i++){ const v=x0+(x1-x0)*i/4; g+=`<text x="${X(v)}" y="${h-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${xfmt(Math.round(v))}</text>`; }
  for(const s of series){
    if(!s.pts.length) continue;
    if(s.line) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''} points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
    if(s.dots) g+=s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r||3}" fill="${s.color}" opacity="${s.op||1}"><title>${xfmt(p[0])}: ${yfmt(p[1])}</title></circle>`).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
const dayLabel = n => shortDate(new Date(n*864e5).toISOString().slice(0,10));
function barChart(items,target,{h=200,W=640}={}){
  const pl=46,pr=12,pt=12,pb=26; const mx=Math.max(target*1.25, ...items.map(i=>i.v), 100);
  const bw=(W-pl-pr)/items.length; const Y=v=>pt+(1-v/mx)*(h-pt-pb); let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${r0(v)}</text>`; }
  items.forEach((it,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64; const col = !it.v ? '#2a2f3a' : it.v>it.t*1.05 ? 'var(--warn)' : it.v<it.t*0.85 ? 'var(--c)' : 'var(--acc)';
    g+=`<rect x="${x}" y="${Y(it.v)}" width="${w}" height="${Math.max(0,Y(0)-Y(it.v))}" rx="4" fill="${col}"><title>${it.l}: ${r0(it.v)} / ${r0(it.t)} kcal</title></rect><text x="${x+w/2}" y="${h-6}" text-anchor="middle">${it.l}</text>`;
    g+=`<line x1="${pl+i*bw+2}" x2="${pl+(i+1)*bw-2}" y1="${Y(it.t)}" y2="${Y(it.t)}" stroke="#e9ecf2" stroke-dasharray="4 3" opacity=".6"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function ring(val,max,size=150,color='var(--acc)',label='',sub=''){
  const r=size/2-12, C=2*Math.PI*r, pct=max?clamp(val/max,0,1):0; const over=val>max;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="12" fill="none"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${over?'var(--warn)':color}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" opacity="${pct>0?1:0}" transform="rotate(-90 ${size/2} ${size/2})"/>

function guessMeal(){ const h=new Date().getHours(); return h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snacks'; }
function pick(type,id){ if(type==='food'){ const f=foodById(id); if(!f) return; UI.sel={type,id,amt:1,unit:'sv'}; } else { if(!recipeById(id)) return; UI.sel={type,id,amt:1}; } render(); }
function setUnit(u){ const f=foodById(UI.sel.id); if(u==='g'&&UI.sel.unit!=='g') UI.sel.amt=r0(UI.sel.amt*f.sg); if(u==='sv'&&UI.sel.unit==='g') UI.sel.amt=r1(UI.sel.amt/f.sg)||1; UI.sel.unit=u; render(); }
function addSel(){ const sel=UI.sel; if(!sel||!(sel.amt>0)) return toast('Enter an amount'); const meal=UI.meal||guessMeal(); let e;
  if(sel.type==='food'){ const f=foodById(sel.id); const g=sel.unit==='g'?sel.amt:sel.amt*f.sg; e={...foodMacros(f,g), name:f.name, amt: sel.unit==='g'? `${r1(g)} g` : `${sel.amt} × ${f.sv}`, ref:'food:'+f.id, meal}; }
  else { const r=recipeById(sel.id), per=recipePer(r); e={kcal:per.kcal*sel.amt,p:per.p*sel.amt,c:per.c*sel.amt,f:per.f*sel.amt,fib:per.fib*sel.amt,name:r.name,amt:`${sel.amt} serving${sel.amt==1?'':'s'}`,ref:'recipe:'+r.id,meal}; }
  day().food.push(e); save(); UI.sel=null; UI.q=''; toast(`Added to ${meal}`); render(); }
function copyDay(n){ const src=peekDay(addDays(UI.date,n)); if(!src.food.length) return toast('Nothing to copy'); day().food.push(...src.food.map(x=>({...x}))); save(); toast(`Copied ${src.food.length} items`); render(); }
async function quickAdd(){ const r=await ask({title:'Quick-add calories',fields:[{label:'Calories (kcal)',type:'number',placeholder:'e.g. 350'},{label:'Protein grams (optional)',type:'number',placeholder:'0'}],ok:'Add'}); if(!r) return; const k=+r[0]; if(!(k>0)) return toast('Enter calories'); const p=+r[1]||0; day().food.push({name:'Quick add',amt:'manual',kcal:k,p,c:0,f:0,fib:0,meal:UI.meal||guessMeal()}); save(); render(); }
function addCustomFood(){ const v=id=>+$('#'+id).value||0; const n=$('#cf_n').value.trim(); if(!n) return toast('Name required'); const sg=v('cf_sg')||100; const div=$('#cf_perserv').checked? sg/100 : 1;
  S.foods.push({id:'c_'+uid(),name:n,k:r1(v('cf_k')/div),p:r1(v('cf_p')/div),c:r1(v('cf_c')/div),f:r1(v('cf_f')/div),fib:r1(v('cf_fib')/div),sv:($('#cf_sv').value||'serving')+` (${sg} g)`,sg,cat:'Custom',custom:true}); save(); toast('Custom food saved'); render(); }
function delCustomFood(id){ S.foods=S.foods.filter(f=>f.id!==id); save(); render(); }

// ---------- TRAINING: calories ----------
// Compendium of Physical Activities: resistance training 3.5 (moderate) / 6.0 (vigorous); circuit training 4.3 (moderate) / 8.0 (vigorous, minimal rest)
function workoutMET(kind,effort,avgRpe){ const vig=effort==='vigorous'||(effort!=='moderate'&&(avgRpe!=null?avgRpe>=8:kind==='circuit')); return kind==='circuit'?(vig?8.0:4.3):(vig?6.0:3.5); }
function estWorkout(ex,kind='strength'){ let sec=0; for(const [n,sets,lo,hi,rest] of ex){ const x=exInfo(n); const work=x.time?(lo+hi)/2:((lo+hi)/2)*3.5+10; sec+=sets*(work+(rest??60)); } const min=Math.round(sec/60)+5;
  const lo=actKcal(kind==='circuit'?4.3:3.5,min).gross, hi=actKcal(kind==='circuit'?8.0:6.0,min).gross; return {min,lo:Math.round(lo/5)*5,hi:Math.round(hi/5)*5}; }
function estHTML(ex,kind){ const e=estWorkout(ex,kind); return `<span class="pill">⏱ ~${e.min} min</span><span class="pill burn">🔥 ${e.lo}–${e.hi} kcal</span>`; }
function burnedDay(d){ let gross=0,net=0,strength=0; for(const a of peekDay(d).acts||[]){ const g=a.gross??a.net; gross+=g; net+=a.net; if(isStrengthAct(a)) strength+=g; } return {gross,net,strength}; }
function avgRpeActive(){ const r=S.active.items.flatMap(it=>it.sets.filter(s=>s.done&&!s.warm&&s.rpe)); return r.length?r.reduce((a,s)=>a+s.rpe,0)/r.length:null; }
function liveKcal(){ const A=S.active; return actKcal(workoutMET(A.kind,A.effort,avgRpeActive()),(Date.now()-A.start)/60000); }
function burnChart(n=14){ const items=[...Array(n)].map((_,i)=>{ const d=addDays(TODAY(),i-n+1); const b=burnedDay(d); return {d,g:b.gross,s:b.strength}; }); const mx=Math.max(100,...items.map(i=>i.g)); const W=640,H=160,pl=40,pb=22,top=8,bw=(W-pl)/n; let g='';
  for(let k=0;k<=2;k++){ const y=H-pb-(H-pb-top)*k/2; g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${r0(mx*k/2)}</text>`; }
  items.forEach((it,i)=>{ const h=(H-pb-top)*it.g/mx, hs=(H-pb-top)*it.s/mx, x=pl+i*bw+bw*.18, w=bw*.64; g+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${h}" rx="4" fill="#fb923c"><title>${shortDate(it.d)}: ${r0(it.g)} kcal burned</title></rect>${hs?`<rect x="${x}" y="${H-pb-hs}" width="${w}" height="${hs}" rx="4" fill="#a78bfa"><title>Strength: ${r0(it.s)} kcal</title></rect>`:''}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${new Date(it.d+'T12:00:00').getDate()}</text>`; });
  const tot=items.reduce((a,b)=>a+b.g,0); return `<h4 style="display:flex;justify-content:space-between"><span>🔥 Calories burned — last ${n} days</span><span style="color:#fdba74">${r0(tot)} kcal · avg ${r0(tot/n)}/day</span></h4><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:#a78bfa"></i>Strength training</span><span><i style="background:#fb923c"></i>Cardio & circuits</span></div>`; }

// ---------- TRAINING: core math ----------
const jsq=s=>esc(JSON.stringify(s));
const fw=kg=>`${r1(showW(kg))} ${wU()}`;
const fmtDur=sec=>{ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; };
function exInfo(name){ const e=EXDB[name]; if(e) return {name,m:e[0],s:e[1],eq:e[2],type:e[3],cue:e[4],bwf:e[5]||0,time:!!e[6]}; const c=(S.customEx||[]).find(x=>x.name===name); if(c) return {name,m:c.m||[],s:c.s||[],eq:c.eq||'Other',type:c.type||'C',cue:c.cue||'',bwf:0,time:false,custom:true}; return {name,m:[],s:[],eq:'Other',type:'C',cue:'',bwf:0,time:false}; }
function allExNames(){ return [...new Set([...Object.keys(EXDB), ...(S.customEx||[]).map(c=>c.name), ...Object.values(S.log).flatMap(d=>(d.sets||[]).map(s=>s.ex))])]; }
function exDatalist(){ return `<datalist id="exlist">${allExNames().sort().map(e=>`<option value="${esc(e)}">`).join('')}</datalist>`; }
// Bodyweight lifts (pull-ups, dips, push-ups) include your bodyweight × the fraction actually lifted
function setLoad(s){ return (s.w||0)+exInfo(s.ex).bwf*currentWeight(); }
function setE1(s){ const x=exInfo(s.ex); if(x.time||s.warm) return 0; return e1rm(setLoad(s), s.r, s.rpe); }
function setVol(s){ const x=exInfo(s.ex); if(x.time||s.warm) return 0; return setLoad(s)*s.r; }
function allSetsOf(ex){ const out=[]; for(const [d,L] of Object.entries(S.log)) for(const s of L.sets||[]) if(s.ex===ex) out.push({...s,date:d}); return out; }
function liftHistory(ex){ const x=exInfo(ex); const out=[]; for(const d of Object.keys(S.log).sort()){ const sets=(S.log[d].sets||[]).filter(s=>s.ex===ex&&!s.warm); if(sets.length) out.push({date:d, best:x.time?Math.max(...sets.map(s=>s.r)):Math.max(...sets.map(setE1)), top:Math.max(...sets.map(s=>s.w||0)), vol:sets.reduce((a,s)=>a+setVol(s),0), sets}); } return out; }
function prBefore(ex,date){ let best=0; for(const d of Object.keys(S.log)){ if(d>=date) continue; for(const s of S.log[d].sets||[]) if(s.ex===ex) best=Math.max(best,setE1(s)); } return best; }
function lastPerf(ex){ for(const d of Object.keys(S.log).sort().reverse()){ const ss=(S.log[d].sets||[]).filter(s=>s.ex===ex&&!s.warm); if(ss.length) return {date:d,sets:ss}; } return null; }
function exRecords(ex){ const r={e1:null,heavy:null,maxR:null,vol:null,rep:{}}; for(const s of allSetsOf(ex).filter(s=>!s.warm)){ const e=setE1(s); if(!r.e1||e>r.e1.v) r.e1={v:e,date:s.date,s};
  if(!r.heavy||s.w>r.heavy.s.w||(s.w===r.heavy.s.w&&s.r>r.heavy.s.r)) r.heavy={date:s.date,s}; if(!r.maxR||s.r>r.maxR.s.r) r.maxR={date:s.date,s};
  for(const k of [1,3,5,8,10,12]) if(s.r>=k&&(!r.rep[k]||s.w>r.rep[k].w)) r.rep[k]={w:s.w,date:s.date}; }
  const h=liftHistory(ex); for(const d of h) if(!r.vol||d.vol>r.vol.v) r.vol={v:d.vol,date:d.date}; r.sessions=h.length; return r; }
// Plate-friendly increment for progressive overload
function incKg(ex){ const x=exInfo(ex); const lower=x.type==='C'&&x.m.some(m=>['Quads','Glutes','Hamstrings'].includes(m)); if(imp()) return readW(x.eq==='Dumbbell'?5:(lower||x.eq==='Machine')?10:5); return x.eq==='Dumbbell'?2:(lower||x.eq==='Machine')?5:2.5; }
function roundKg(kg){ const st=imp()?5:2.5; return readW(Math.round(showW(kg)/st)*st); }
// Double progression: hit the top of the rep range on every working set → add load
function suggest(ex,lo,hi){ const x=exInfo(ex); const lp=lastPerf(ex);
  if(!lp&&x.eq==='Bodyweight'&&!x.time) return {w:0,msg:`First time: do clean reps with full range, stopping 1–3 reps short of failure. Too easy? Use a harder variation.`};
  if(!lp) return {w:null,msg:x.time?'First time: hold with perfect form, stop 5–10 s before failure.':'First time here: pick a weight you could lift for 2–3 more reps than the target (RPE 7–8).'};
  if(x.time){ const b=Math.max(...lp.sets.map(s=>s.r)); return {w:lp.sets[0].w||0,msg:`Last best: ${b} s. Aim for ${b+5}–${b+10} s.`}; }
  const top=Math.max(...lp.sets.map(s=>s.w||0)); const work=lp.sets.filter(s=>(s.w||0)>=top*0.97); const minR=Math.min(...work.map(s=>s.r)); const rp=work.filter(s=>s.rpe); const avgRpe=rp.length?rp.reduce((a,s)=>a+s.rpe,0)/rp.length:null; const inc=incKg(ex);
  if(top===0&&(x.eq==='Bodyweight'||x.bwf)){ if(minR>=hi) return {w:0,up:true,msg:`↑ You hit ${hi}+ reps on every set — progress to a harder variation, slow the tempo (3 s down), or add load.`}; return {w:0,msg:`Beat last time's reps (${work.map(s=>s.r).join(', ')}). Progress once every set reaches ${hi}.`}; }
  if(minR>=hi && !(avgRpe>=9.5)){ const nw=exInfo(ex).eq==='Dumbbell'&&!imp()?top+inc:Math.max(roundKg(top+inc),top+inc*0.5); return {w:nw,up:true,msg:`↑ Add weight: ${fw(nw)}. You hit ${hi}+ reps on every working set last time (${shortDate(lp.date)}).`}; }
  if(minR<lo && avgRpe>=9.5) return {w:roundKg(top*0.9),msg:`↓ Missed the rep target at max effort — drop ~10% to ${fw(roundKg(top*0.9))} and build back up.`};
  if(minR<lo) return {w:top,msg:`Repeat ${fw(top)} and aim for ${lo}+ reps on every set.`};
  return {w:top,msg:`Stay at ${fw(top)} and beat last time's reps (${work.map(s=>s.r).join(', ')}). Add weight once every set reaches ${hi}.`}; }
function defaultRange(ex){ const x=exInfo(ex); return x.time?[30,60]:x.type==='C'?[6,10]:[10,15]; }
function warmupScheme(wKg,eq){ const bar=imp()?readW(45):20; const st=imp()?readW(5):2.5; const rd=v=>Math.round(v/st)*st;
  if(eq==='Barbell'){ if(wKg<=bar*1.2) return []; const out=[[bar,10]]; for(const [p,r] of [[.4,5],[.6,3],[.8,2]]){ const v=rd(wKg*p); if(v>bar+st/2&&v<wKg-st/2&&!out.some(o=>Math.abs(o[0]-v)<0.1)) out.push([v,r]); } return out; }
  return [[rd(wKg*0.5),8],[rd(wKg*0.75),4]].filter(([v])=>v>0); }
function weekKey(d){ const dt=new Date(d+'T12:00:00'); return addDays(d,-((dt.getDay()+6)%7)); }
const isStrengthAct=a=>a.strength||/^Weight training/.test(a.name);
function trainedDay(L){ return (L.sets||[]).some(s=>!s.warm)||(L.acts||[]).length>0; }
function streakWeeks(){ const has=w=>{ for(let i=0;i<7;i++) if(trainedDay(peekDay(addDays(w,i)))) return true; return false; }; let wk=weekKey(TODAY()), n=0; if(!has(wk)) wk=addDays(wk,-7); while(has(wk)&&n<520){ n++; wk=addDays(wk,-7); } return n; }
function muscleSets(days=7){ const m={}; for(let i=0;i<days;i++) for(const s of peekDay(addDays(TODAY(),-i)).sets||[]){ if(s.warm) continue; const x=exInfo(s.ex); x.m.forEach(k=>m[k]=(m[k]||0)+1); x.s.forEach(k=>m[k]=(m[k]||0)+0.5); } return m; }
function cardioWeek(){ let mod=0,vig=0; for(let i=0;i<7;i++) for(const a of peekDay(addDays(TODAY(),-i)).acts||[]){ if(isStrengthAct(a)) continue; if(a.met>=6) vig+=a.min; else if(a.met>=3) mod+=a.min; } return {mod,vig,eq:mod+2*vig}; }
function heatmap(weeks=18){ const start=addDays(weekKey(TODAY()),-(weeks-1)*7), cs=14, gap=3; let g='';
  for(let w=0;w<weeks;w++) for(let d=0;d<7;d++){ const date=addDays(start,w*7+d); if(date>TODAY()) continue; const L=peekDay(date); const sets=(L.sets||[]).filter(s=>!s.warm).length; const cm=(L.acts||[]).filter(a=>!isStrengthAct(a)).reduce((a,b)=>a+b.min,0); const v=sets+cm/5;
    const col=v===0?'#1d212a':v<8?'#14532d':v<16?'#15803d':v<24?'#22c55e':'#4ade80'; g+=`<rect x="${32+w*(cs+gap)}" y="${d*(cs+gap)}" width="${cs}" height="${cs}" rx="3" fill="${col}" ${date===TODAY()?'stroke="#e9ecf2"':''}><title>${shortDate(date)}: ${sets} sets, ${r0(cm)} cardio min</title></rect>`; }
  ['Mon','','Wed','','Fri','','Sun'].forEach((l,i)=>g+=`<text x="0" y="${i*(cs+gap)+11}">${l}</text>`);
  return `<svg class="chart" viewBox="0 0 ${32+weeks*(cs+gap)} ${7*(cs+gap)}">${g}</svg>`; }

function itemHTML(it,i){ const x=exInfo(it.ex); const best=Math.max(0,...allSetsOf(it.ex).map(setE1)); let n=0;

function wSet(i,j,k,v){ const s=S.active.items[i].sets[j]; if(k==='w') s.w=v===''?null:readW(+v); else if(k==='r') s.r=v===''?null:+v; else s.rpe=v===''?null:+v; save(); }
function doneSet(i,j){ const it=S.active.items[i], s=it.sets[j];
  if(!s.done){ if(s.r==null) s.r=s.pr||0; if(s.w==null) s.w=0; if(!(s.r>0)) return toast('Enter reps first'); s.done=true;
    const nx=it.sets[j+1]; if(nx&&nx.w==null&&!s.warm) nx.w=s.w;
    if(!s.warm){ const e=setE1({...s,ex:it.ex}); const prev=Math.max(prBefore(it.ex,'9999-12-31'),...it.sets.filter((o,k)=>k!==j&&o.done&&!o.warm).map(o=>setE1({...o,ex:it.ex})),0); if(prev>0&&e>prev){ toast(`🏆 PR! e1RM ${fw(e)}`); } }

function addWarmups(i){ const it=S.active.items[i]; const w=it.sets.find(s=>!s.warm&&s.w>0)?.w; if(!w) return toast('Enter your working weight first'); it.sets=it.sets.filter(s=>!(s.warm&&!s.done));

async function finishWorkout(){ const A=S.active; const sets=A.items.flatMap(it=>it.sets.filter(s=>s.done&&s.r>0).map(s=>{ const o={ex:it.ex,w:s.w||0,r:s.r,rpe:s.rpe||null,kg:true}; if(s.warm) o.warm=true; return o; }));
  if(!sets.length){ if(await askConfirm('No sets are ticked as done yet. Tick sets with ✓ to save them.',{title:'Nothing to save',ok:'Discard workout',cancel:'Keep training',danger:true})) discardWorkout(true); return; }
  let dur=Math.max(1,Math.round((Date.now()-A.start)/60000)); if(dur>180){ const v=+(await askPrompt('How many minutes did you actually train?',75,{msg:'This workout has been open a long time.',type:'number',ok:'Save'})); if(v>0) dur=v; }
  const prs=[...new Set(sets.filter(s=>{ const p=prBefore(s.ex,'9999-12-31'); return !s.warm&&p>0&&setE1(s)>p; }).map(s=>s.ex))];
  const rp=sets.filter(s=>s.rpe&&!s.warm); const avg=rp.length?rp.reduce((a,s)=>a+s.rpe,0)/rp.length:null; const met=workoutMET(A.kind,A.effort,avg); const circ=A.kind==='circuit';

  S.active=null; save(); UI.date=A.date; UI.tsub='log'; toast(`Saved · ${dur} min · 🔥 ${r0(e.gross)} kcal burned${prs.length?` · 🏆 ${prs.length} PR${prs.length>1?'s':''}`:''}`); render(); }

  <div class="g2" style="margin-top:14px">

   <div class="card"><h3>Weekly sets per muscle <small>target 10–20</small></h3>
    ${MUSCLES.map(m=>{ const v=ms[m]||0; const col=v<10?'var(--c)':v<=20?'var(--acc)':'#fb923c'; return `<div style="margin-bottom:6px"><div class="row sp sm"><span>${m}</span><span class="mut">${r1(v)} sets</span></div><div class="bar" style="position:relative"><i style="width:${clamp(v/25*100,0,100)}%;background:${col}"></i></div></div>`; }).join('')}
    <div class="tip">Primary muscles count 1 set, secondary ½. Roughly 10–20 hard sets per muscle per week is the range most associated with hypertrophy; yellow = below, orange = above (fine if you're recovering well).</div></div></div>

// ----- Tools -----
function tl(){ return UI.tl??={w:imp()?185:85,r:5,rpe:'',pe1:'',pt:imp()?225:100,bar:imp()?45:20,ww:imp()?225:100,age:S.profile.age,rhr:60,mhr:'',dist:5,du:imp()?'mi':'km',hh:0,mm:imp()?45:28,ss:0,mode:'run',grade:0}; }
function tv(k,v){ tl()[k]=v; refreshTools(); }
function refreshTools(){ for(const k in TOOLS_OUT){ const e=$('#to_'+k); if(e) e.innerHTML=TOOLS_OUT[k](); } }
const tin=(k,label,w=80,step='any')=>`<label>${label}<input type="number" step="${step}" value="${tl()[k]}" style="width:${w}px" oninput="tv('${k}',this.value)"></label>`;
function platesFor(total,bar){ const P=imp()?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25]; let side=(total-bar)/2; const out=[]; if(side<0) return null; for(const p of P){ while(side>=p-1e-6){ out.push(p); side-=p; } } return {plates:out,rem:side}; }
const PCOL={45:'#3b82f6',25:'#ef4444',35:'#eab308',20:'#3b82f6',15:'#eab308',10:'#22c55e',5:'#e5e7eb',2.5:'#6b7280',1.25:'#9ca3af'};
function fmtMin(m){ return fmtDur(m*60); }
const TOOLS_OUT={
 orm(){ const t=tl(), w=+t.w, r=+t.r, rpe=+t.rpe||0; if(!(w>0&&r>0)) return '<div class="mut">Enter weight and reps.</div>'; const n=r+(rpe?clamp(10-rpe,0,5):0);
  const F=n<=1?[['All formulas',w]]:[['Epley',w*(1+n/30)],['Brzycki',n<37?w*36/(37-n):NaN],['Lombardi',w*Math.pow(n,0.1)],['Mayhew',100*w/(52.2+41.9*Math.exp(-0.055*n))],['Wathan',100*w/(48.8+53.8*Math.exp(-0.075*n))]]; const best=e1rm(w,r,rpe||null);
  return `<div class="stat" style="margin:8px 0"><span class="v" style="color:var(--acc)">${r1(best)} ${wU()}</span><span class="l">Forge e1RM (Epley/Brzycki mean${rpe?`, ${10-rpe} RIR added`:''})</span></div>
   <div class="row sm mut">${F.map(([k,v])=>`<span>${k}: <b style="color:var(--text)">${isNaN(v)?'—':r1(v)}</b></span>`).join(' · ')}</div>${n>12?'<div class="note w" style="margin-top:8px">Estimates get less reliable above ~12 reps.</div>':''}
   <table style="margin-top:10px"><tr><th>% 1RM</th><th class="r">Weight</th><th class="r">≈ Reps to failure</th></tr>${[100,95,90,85,80,75,70,65,60,50].map(p=>`<tr><td>${p}%</td><td class="r">${r1(best*p/100)}</td><td class="r">${p===100?1:Math.round(30*(100/p-1))}</td></tr>`).join('')}</table>`; },
 rpe(){ const e=+tl().pe1||0; const cols=[10,9.5,9,8.5,8,7.5,7,6.5,6];
  return `<div style="overflow:auto"><table><tr><th>Reps</th>${cols.map(c=>`<th class="r">@${c}</th>`).join('')}</tr>${[1,2,3,4,5,6,7,8,10,12].map(r=>`<tr><td class="b">${r}</td>${cols.map(c=>{ const p=1/e1rm(1,r,c); return `<td class="r">${e?r0(e*p):r0(p*100)+'%'}</td>`; }).join('')}</tr>`).join('')}</table></div><div class="tip">${e?`Weights for an e1RM of ${e} ${wU()}.`:'Values are % of 1RM. Enter your e1RM to see weights.'} RPE 10 = no reps left, 9 = 1 rep left, 8 = 2 left…</div>`; },
 plate(){ const t=tl(); const res=platesFor(+t.pt,+t.bar); if(!res) return '<div class="mut">Target is lighter than the bar.</div>'; const max=imp()?45:25;
  const vis=res.plates.map(p=>{ const h=40+60*p/max; return `<div title="${p}" style="width:${p>=10?18:12}px;height:${h}px;background:${PCOL[p]};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;writing-mode:vertical-rl">${p}</div>`; }).join('');
  return `<div style="display:flex;align-items:center;gap:2px;margin:12px 0;height:110px"><div style="width:60px;height:10px;background:#9ca3af;border-radius:2px"></div><div style="width:8px;height:30px;background:#9ca3af"></div>${vis}<div style="width:30px;height:10px;background:#9ca3af;border-radius:0 2px 2px 0"></div></div>
   <div><b>Per side:</b> ${res.plates.length?res.plates.join(' + '):'nothing — just the bar'}</div>${res.rem>0.01?`<div class="note w" style="margin-top:8px">Can't load exactly — closest is ${r1(+t.pt-res.rem*2)} ${wU()}.</div>`:''}`; },
 warm(){ const t=tl(); const w=+t.ww, bar=+t.bar; if(!(w>0)) return ''; const st=imp()?5:2.5; const rd=v=>Math.round(v/st)*st; const rows=[[bar,10,'Empty bar']]; for(const [p,r] of [[.4,5],[.6,3],[.8,2]]){ const v=rd(w*p); if(v>bar&&v<w&&!rows.some(o=>o[0]===v)) rows.push([v,r,Math.round(p*100)+'%']); } rows.push([w,'work','Working sets']);
  return `<table><tr><th>Set</th><th class="r">Weight</th><th class="r">Reps</th><th>Plates / side</th></tr>${rows.map((x,i)=>{ const pl=platesFor(x[0],bar); return `<tr><td>${x[2]}</td><td class="r b">${r1(x[0])}</td><td class="r">${x[1]}</td><td class="mut sm">${pl&&pl.plates.length?pl.plates.join(' + '):'—'}</td></tr>`; }).join('')}</table><div class="tip">Rest ~1 min between warm-ups. Warm-ups are excluded from volume and PRs.</div>`; },
 hr(){ const t=tl(); const age=+t.age||30, rhr=+t.rhr||60; const mhr=+t.mhr||Math.round(208-0.7*age); const Z=[['Zone 1 · Recovery',.5,.6,'#60a5fa'],['Zone 2 · Aerobic base',.6,.7,'#22c55e'],['Zone 3 · Tempo',.7,.8,'#eab308'],['Zone 4 · Threshold',.8,.9,'#fb923c'],['Zone 5 · VO₂max',.9,1,'#ef4444']];
  return `<div class="row sm mut" style="margin:6px 0">Max HR ${mhr} bpm ${t.mhr?'(measured)':`(Tanaka: 208 − 0.7 × age; the old 220 − age gives ${220-age})`} · HR reserve ${mhr-rhr}</div>
   ${Z.map(([n,a,b,c])=>`<div style="margin-bottom:6px"><div class="row sp sm"><span><b style="color:${c}">${n}</b> <span class="mut">${a*100}–${b*100}%</span></span><b>${Math.round(rhr+a*(mhr-rhr))}–${Math.round(rhr+b*(mhr-rhr))} bpm</b></div><div class="bar"><i style="width:${b*100}%;background:${c}"></i></div></div>`).join('')}
   <div class="tip">Karvonen (heart-rate reserve) method. Most endurance volume (~80%) belongs in zones 1–2.</div>`; },
 pace(){ const t=tl(); const dm=(+t.dist)*(t.du==='mi'?1609.344:1000); const min=(+t.hh)*60+(+t.mm)+(+t.ss)/60; if(!(dm>0&&min>0)) return '<div class="mut">Enter distance and time.</div>';
  const v=dm/min, g=(+t.grade||0)/100; const vo2=t.mode==='walk'?0.1*v+1.8*v*g+3.5:0.2*v+0.9*v*g+3.5; const met=vo2/3.5; const kg=currentWeight(); const rmr=bmrInfo(kg).bmr/1440/5*1000/kg;
  const gross=vo2*kg*min*0.005, net=Math.max(0,vo2-rmr)*kg*min*0.005; const kmh=v*60/1000;
  let warn=''; if(t.mode==='walk'&&(v<50||v>100)) warn='The ACSM walking equation is validated for 1.9–3.7 mph (3–6 km/h).'; if(t.mode==='run'&&v<134) warn='The ACSM running equation is validated above 5 mph (8 km/h); at this pace consider the walking mode.';
  let vd=''; if(t.mode==='run'&&dm>=1500&&min>=3.5&&g===0){ const vo=-4.60+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*min)+0.2989558*Math.exp(-0.1932605*min); const vdot=vo/pct;
   vd=`<h4>Race fitness</h4><div class="stats"><div class="stat"><span class="v">${r1(vdot)}</span><span class="l">VDOT (≈ VO₂max)</span></div>${[['5K',5000],['10K',10000],['Half',21097.5],['Marathon',42195]].map(([n,d])=>`<div class="stat"><span class="v" style="font-size:17px">${fmtMin(min*Math.pow(d/dm,1.06))}</span><span class="l">${n} prediction</span></div>`).join('')}</div><div class="tip">VDOT from Daniels & Gilbert; predictions via Riegel's formula (T₂ = T₁ × (D₂/D₁)^1.06) — assume equal training for the distance.</div>`; }
  UI._pace={name:`${t.mode==='walk'?'Walk':'Run'} ${t.dist} ${t.du} in ${fmtMin(min)}${g?` @ ${t.grade}% grade`:''}`,met:r1(met),min:r1(min),net,gross};
  return `<div class="stats" style="margin-top:8px"><div class="stat"><span class="v">${fmtMin(min/(dm/1000))}</span><span class="l">per km</span></div><div class="stat"><span class="v">${fmtMin(min/(dm/1609.344))}</span><span class="l">per mile</span></div><div class="stat"><span class="v">${r1(kmh)}</span><span class="l">km/h · ${r1(kmh/1.609)} mph</span></div><div class="stat"><span class="v">${r1(met)}</span><span class="l">METs (${r1(vo2)} ml/kg/min)</span></div><div class="stat"><span class="v" style="color:var(--acc)">${r0(net)}</span><span class="l">kcal net (${r0(gross)} gross)</span></div></div>
   ${warn?`<div class="note w" style="margin-top:8px">${warn}</div>`:''}<button class="btn" style="margin-top:10px" onclick="logPace()">Log to ${UI.date===TODAY()?'today':shortDate(UI.date)}</button>${vd}`; },
};

// ---------- BODY ----------
function vBody(){

  if(last && wk && Math.abs(toGoal)>0.2 && Math.sign(wk)===-Math.sign(toGoal)){ const weeks=Math.abs(toGoal/wk); eta = weeks>260?'> 5 years':new Date(Date.now()+weeks*7*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  const ms=[...S.measures].sort((a,b)=>a.date<b.date?-1:1); const lm=ms[ms.length-1];
  const bfPts=ms.filter(m=>m.bf).map(m=>[dnum(m.date),m.bf]);

   ${lineChart([{pts:vis.map(x=>[dnum(x.date),showW(x.kg)]),color:'#98a1b1',dots:true,r:2.5,op:.6},{pts:vis.map(x=>[dnum(x.date),showW(x.trend)]),color:'var(--acc)',line:true,w:3},{pts:vis.length&&goalNear(vis,p.goalWeightKg)?[[dnum(vis[0].date),showW(p.goalWeightKg)],[dnum(vis[vis.length-1].date),showW(p.goalWeightKg)]]:[],color:'var(--c)',line:true,dash:true,w:1.5}],{xfmt:dayLabel})}
   <div class="legend"><span><i style="background:#98a1b1"></i>Scale weight</span><span><i style="background:var(--acc)"></i>Smoothed trend (EMA)</span><span><i style="background:var(--c)"></i>Goal</span></div>
   <div class="stats" style="margin-top:14px">
    <div class="stat"><span class="v">${last?r1(showW(last.trend)):'—'}</span><span class="l">Trend (${wU()})</span></div>
    <div class="stat"><span class="v">${wk===null?'—':(wk>0?'+':'')+r1(showW(wk))}</span><span class="l">${wU()}/week (21d)</span></div>

  </div>
  <div class="card"><h3>Log weight</h3>
   <div class="row"><label>Date<input type="date" id="bw_d" value="${TODAY()}"></label><label>Weight (${wU()})<input type="number" step="0.1" id="bw_v"></label><button class="btn" style="align-self:flex-end" onclick="logWeight($('#bw_d').value,+$('#bw_v').value)">Save</button></div>
   <div class="tip">For best accuracy: weigh daily, after waking and using the bathroom, before eating.</div>
   <div style="max-height:300px;overflow:auto;margin-top:10px"><table><tr><th>Date</th><th class="r">Scale</th><th class="r">Trend</th><th class="r">Δ trend</th><th></th></tr>${[...tr].reverse().slice(0,60).map((x,i,a)=>`<tr><td>${shortDate(x.date)}</td><td class="r">${r1(showW(x.kg))}</td><td class="r">${r1(showW(x.trend))}</td><td class="r mut">${a[i+1]?((x.trend-a[i+1].trend>0?'+':'')+r1(showW(x.trend-a[i+1].trend)).toFixed?.(1)):''}</td><td class="r"><button class="x" onclick="delWeight('${x.date}')">✕</button></td></tr>`).join('')}</table></div>
  </div></div>
  <div class="g2" style="margin-top:14px">
  <div class="card"><h3>Body composition <small>U.S. Navy tape method (±3–4%)</small></h3>
   <div class="row"><label>Date<input type="date" id="m_d" value="${TODAY()}"></label><label>Waist (${lU()}) <span class="sm">at navel${p.sex==='male'?'':' / narrowest'}</span><input type="number" step="0.1" id="m_w"></label><label>Neck (${lU()})<input type="number" step="0.1" id="m_n"></label>${p.sex==='female'?`<label>Hips (${lU()})<input type="number" step="0.1" id="m_h"></label>`:''}<label>Chest<input type="number" step="0.1" id="m_c"></label><label>Arm<input type="number" step="0.1" id="m_a"></label><label>Thigh<input type="number" step="0.1" id="m_t"></label>

   </div>
   ${bf&&Math.abs((p.bodyFat||0)-bf)>0.4?`<button class="btn g s" style="margin-top:10px" onclick="S.profile.bodyFat=${r1(bf)};save();toast('BMR now uses Katch-McArdle');render()">Use ${r1(bf)}% for BMR (Katch-McArdle)</button>`:''}
   <div class="tip">Waist-to-height under 0.5 is associated with lower cardiometabolic risk.</div>

  </div>
  <div class="card"><h3>Measurement history</h3>${ms.length?`<div style="overflow:auto"><table><tr><th>Date</th><th class="r">Waist</th><th class="r">Neck</th><th class="r">Hips</th><th class="r">Chest</th><th class="r">Arm</th><th class="r">Thigh</th><th class="r">BF%</th><th></th></tr>${[...ms].reverse().map(m=>`<tr><td>${shortDate(m.date)}</td>${['waist','neck','hip','chest','arm','thigh'].map(k=>`<td class="r">${m[k]?r1(showL(m[k])):'—'}</td>`).join('')}<td class="r b">${m.bf?r1(m.bf):'—'}</td><td class="r"><button class="x" onclick="delMeasure('${m.id}')">✕</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No measurements yet. Measure every 2–4 weeks.</div>'}</div>
  </div>`;
}
function goalNear(vis,g){ const ys=vis.map(x=>x.kg); const lo=Math.min(...ys),hi=Math.max(...ys); return g>=lo-(hi-lo)*1.5 && g<=hi+(hi-lo)*1.5; }
function logWeight(d,v){ if(!(v>0)) return toast('Enter a weight'); const kg=readW(v); if(kg<25||kg>350) return toast('That weight looks off'); S.weights=S.weights.filter(w=>w.date!==d); S.weights.push({date:d,kg}); S.profile.weightKg=currentWeight(); save(); toast('Weight saved'); render(); }
function delWeight(d){ S.weights=S.weights.filter(w=>w.date!==d); save(); render(); }
function addMeasure(){ const g=id=>{const e=$('#'+id); return e&&+e.value? readL(+e.value):null;}; const m={id:uid(),date:$('#m_d').value,waist:g('m_w'),neck:g('m_n'),hip:g('m_h'),chest:g('m_c'),arm:g('m_a'),thigh:g('m_t')};
  if(!m.waist&&!m.chest&&!m.arm&&!m.thigh) return toast('Enter at least one measurement'); if(m.waist&&m.neck){ const bf=navyBF(S.profile.sex,S.profile.heightCm,m.waist,m.neck,m.hip); if(bf&&bf>2&&bf<70) m.bf=bf; }
  S.measures.push(m); save(); toast(m.bf?`Body fat ≈ ${r1(m.bf)}%`:'Saved'); render(); }
function delMeasure(id){ S.measures=S.measures.filter(m=>m.id!==id); save(); render(); }

   </div></div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; }
function logRecipe(id){ const r=recipeById(id), per=recipePer(r); const s=+$('#rl_s').value||1, meal=$('#rl_m').value, d=$('#rl_d').value||UI.date;
  day(d).food.push({kcal:per.kcal*s,p:per.p*s,c:per.c*s,f:per.f*s,fib:per.fib*s,name:r.name,amt:`${s} serving${s==1?'':'s'}`,ref:'recipe:'+id,meal}); save(); closeModal(); toast(`Logged ${r0(per.kcal*s)} kcal to ${meal}`); render(); }
function addShop(id,serv){ const ex=S.shopping.find(s=>s.id===id); if(ex) ex.serv+=serv; else S.shopping.push({id,serv}); save(); toast('Added to shopping list'); render(); }
async function delRecipe(id){ if(!await askConfirm('This can\'t be undone.',{title:'Delete this recipe?',ok:'Delete',danger:true})) return; S.recipes=S.recipes.filter(r=>r.id!==id); save(); closeModal(); render(); }
// Recipe builder
let RB=null;
function recipeBuilder(){ RB={name:'',em:'🍽️',serv:2,time:20,tags:'',ing:[],steps:''}; drawRB(); }
function drawRB(){ const tot=sumM(RB.ing.map(([id,g])=>foodMacros(foodById(id),g))); const s=RB.serv||1;
  $('#modal').innerHTML=`<div class="modal"><div class="card"><div class="row sp"><h2 style="margin:0">Create recipe</h2><button class="x" style="font-size:22px" onclick="closeModal()">✕</button></div>
  <div class="row" style="margin-top:12px"><label style="width:60px">Icon<input value="${esc(RB.em)}" oninput="RB.em=this.value"></label><label style="flex:1;min-width:200px">Name<input value="${esc(RB.name)}" oninput="RB.name=this.value"></label><label>Servings<input type="number" value="${RB.serv}" onchange="RB.serv=Math.max(1,+this.value||1);drawRB()"></label><label>Minutes<input type="number" value="${RB.time}" oninput="RB.time=+this.value||0"></label></div>
  <label style="margin-top:10px">Tags (comma-separated)<input value="${esc(RB.tags)}" placeholder="Dinner, High-protein" oninput="RB.tags=this.value"></label>
  <h4>Ingredients</h4>
  <div class="row"><select id="rb_f" style="flex:1;min-width:200px">${allFoods().slice().sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><input type="number" id="rb_g" placeholder="grams"><button class="btn g" onclick="const g=+$('#rb_g').value;if(g>0){RB.ing.push([$('#rb_f').value,g]);drawRB()}">Add</button></div>
  <table style="margin-top:8px">${RB.ing.map(([id,g],i)=>{const f=foodById(id),m=foodMacros(f,g);return `<tr><td>${esc(f.name)}</td><td class="r">${g} g</td><td class="r">${r0(m.kcal)} kcal</td><td class="r"><button class="x" onclick="RB.ing.splice(${i},1);drawRB()">✕</button></td></tr>`}).join('')}</table>
  <div class="mrow" style="margin-top:10px"><div><b>${r0(tot.kcal/s)}</b><span>kcal/serv</span></div><div><b style="color:var(--p)">${r1(tot.p/s)}g</b><span>protein</span></div><div><b style="color:var(--c)">${r1(tot.c/s)}g</b><span>carbs</span></div><div><b style="color:var(--f)">${r1(tot.f/s)}g</b><span>fat</span></div></div>
  <label style="margin-top:12px">Method (one step per line)<textarea rows="4" oninput="RB.steps=this.value">${esc(RB.steps)}</textarea></label>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="saveRB()">Save recipe</button></div></div></div>`; }
function saveRB(){ if(!RB.name.trim()||!RB.ing.length) return toast('Name and at least one ingredient'); S.recipes.push({id:'cr_'+uid(),em:RB.em||'🍽️',name:RB.name.trim(),serv:RB.serv,time:RB.time,tags:RB.tags.split(',').map(t=>t.trim()).filter(Boolean),ing:RB.ing,steps:RB.steps.split('\n').map(s=>s.trim()).filter(Boolean),custom:true}); save(); closeModal(); toast('Recipe saved'); render(); }

// ---------- PROFILE ----------
function vProfile(){
  const p=S.profile, T=targets(); const ft=Math.floor(p.heightCm/2.54/12), inch=r1(p.heightCm/2.54-ft*12);
  const bmiCat = T.bmi<18.5?'Underweight':T.bmi<25?'Healthy':T.bmi<30?'Overweight':'Obese';
  return `<div class="g2">
  <div class="card"><h3>Profile</h3>
   <div class="row">
    <label>Units<select onchange="setP('units',this.value)"><option value="imperial" ${imp()?'selected':''}>Imperial (lb, in)</option><option value="metric" ${!imp()?'selected':''}>Metric (kg, cm)</option></select></label>
    <label>Sex<select onchange="setP('sex',this.value)"><option value="female" ${p.sex==='female'?'selected':''}>Female</option><option value="male" ${p.sex==='male'?'selected':''}>Male</option></select></label>
    <label>Age<input type="number" value="${p.age}" onchange="setP('age',+this.value)"></label>
    ${imp()?`<label>Height ft<input type="number" value="${ft}" id="hft" onchange="setH()" style="width:60px"></label><label>in<input type="number" step="0.5" value="${inch}" id="hin" onchange="setH()" style="width:60px"></label>`:`<label>Height cm<input type="number" value="${r1(p.heightCm)}" onchange="setP('heightCm',+this.value)"></label>`}
   </div>
   <div class="row" style="margin-top:10px">
    <label>Weight (${wU()}) ${S.weights.length?'<span class="sm">— from trend</span>':''}<input type="number" step="0.1" value="${r1(showW(currentWeight()))}" ${S.weights.length?'disabled':''} onchange="setP('weightKg',readW(+this.value))"></label>
    <label>Body fat % (optional)<input type="number" step="0.1" value="${p.bodyFat??''}" placeholder="—" onchange="setP('bodyFat',this.value===''?null:+this.value)"></label>
    <label>Goal weight (${wU()})<input type="number" step="0.1" value="${r1(showW(p.goalWeightKg))}" onchange="setP('goalWeightKg',readW(+this.value))"></label>
   </div>
   <label style="margin-top:10px">Daily activity <span class="sm">(lifestyle only — log workouts separately)</span><select onchange="setP('activity',+this.value)">${ACT_LEVELS.map(([v,l])=>`<option value="${v}" ${p.activity===v?'selected':''}>${l} — ×${v}</option>`).join('')}</select></label>
   <h3 style="margin-top:16px">Goal</h3>
   <div class="row">
    <label>Goal<select onchange="setP('goal',this.value)">${[['lose','Lose fat'],['maintain','Maintain / recomp'],['gain','Build muscle (lean gain)']].map(([v,l])=>`<option value="${v}" ${p.goal===v?'selected':''}>${l}</option>`).join('')}</select></label>
    ${p.goal!=='maintain'?`<label>Rate (${wU()}/week)<input type="number" step="0.05" value="${r1(showW(p.rate)*100)/100}" onchange="setP('rate',readW(+this.value))"></label><span class="mut sm" style="align-self:flex-end">≈ ${r1(p.rate/currentWeight()*100)}% BW/wk · ${r0(p.rate*KCAL_PER_KG/7)} kcal/day</span>`:''}
   </div>
   <div class="row" style="margin-top:10px">
    <label>Protein (g/kg)<input type="number" step="0.1" value="${p.proteinPerKg}" onchange="setP('proteinPerKg',+this.value)"></label>
    <label>Fat (% kcal)<input type="number" step="1" value="${r0(p.fatPct*100)}" onchange="setP('fatPct',clamp(+this.value,15,50)/100)"></label>
    <label>Eat back exercise kcal<select onchange="setP('eatBack',+this.value)">${[0,0.5,0.75,1].map(v=>`<option value="${v}" ${p.eatBack===v?'selected':''}>${v*100}%</option>`).join('')}</select></label>
    <label>TDEE source<select onchange="setP('useAdaptive',this.value==='1')"><option value="1" ${p.useAdaptive?'selected':''}>Adaptive when available</option><option value="0" ${!p.useAdaptive?'selected':''}>Formula only</option></select></label>
   </div>
   <div class="tip">Protein: 1.6–2.2 g/kg supports muscle retention/growth (ISSN). When BMI &gt; 30, protein is calculated from an adjusted reference weight. Exercise trackers commonly overestimate burn, so eating back 50–75% is a sensible default.</div>
  </div>
  <div class="card"><h3>Your numbers</h3>
   <div class="stats">
    <div class="stat"><span class="v">${r0(T.bmr)}</span><span class="l">BMR</span></div>
    <div class="stat"><span class="v">${r0(T.formula)}</span><span class="l">Formula TDEE</span></div>
    <div class="stat"><span class="v" style="color:${T.ad?'var(--acc)':'var(--mut)'}">${T.ad?r0(T.ad.tdee):'—'}</span><span class="l">Adaptive TDEE</span></div>
    <div class="stat"><span class="v">${r1(T.bmi)}</span><span class="l">BMI · ${bmiCat}</span></div>
   </div>
   <div class="tip">BMR method: <b>${T.method}</b>. ${T.ad?`Adaptive TDEE uses ${T.ad.days} logged days and your weight trend (${T.ad.slopeWk>0?'+':''}${r1(showW(T.ad.slopeWk))} ${wU()}/wk) at an average intake of ${r0(T.ad.avgIntake)} kcal — ${T.ad.confidence} confidence.`:'Adaptive TDEE unlocks after ~14 days of food logging (≥10 days) plus 5+ weigh-ins spanning 2 weeks. It measures your real metabolism instead of estimating it.'}</div>
   <h3 style="margin-top:16px">Daily targets</h3>
   <div class="mrow" style="grid-template-columns:repeat(3,1fr)">
    <div><b>${r0(T.kcal)}</b><span>kcal</span></div><div><b style="color:var(--p)">${r0(T.protein)} g</b><span>protein</span></div><div><b style="color:var(--c)">${r0(T.carbs)} g</b><span>carbs</span></div>
    <div><b style="color:var(--f)">${r0(T.fat)} g</b><span>fat</span></div><div><b style="color:var(--fib)">${r0(T.fiber)} g</b><span>fiber</span></div><div><b style="color:var(--water)">${imp()?r0(T.water/29.57)+' oz':r1(T.water/1000)+' L'}</b><span>water</span></div>
   </div>
   ${T.floored?`<div class="note w" style="margin-top:10px">Target capped at the minimum of ${r0(T.kcal)} kcal. Your chosen rate would require ${r0(T.tdee+T.delta)} kcal.</div>`:''}
   <h3 style="margin-top:16px">Data</h3>
   <div class="row"><button class="btn g" onclick="exportData()">⬇ Export backup</button><label class="btn g" style="flex-direction:row;color:var(--text);font-size:14px">⬆ Import<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn g" onclick="loadDemo()">Load demo data</button><button class="btn d" onclick="resetAll()">Reset all</button></div>
   <div class="tip">All data is stored only in this browser. Export regularly to keep a backup.</div>
  </div></div>
  <div class="card" style="margin-top:14px"><h3>How Forge calculates things</h3><div class="mut" style="columns:2 300px;column-gap:28px">
   <p><b>BMR</b>: Mifflin-St Jeor (most accurate predictive equation in validation studies), or Katch-McArdle when body fat is known.</p>
   <p><b>Adaptive TDEE</b>: average logged intake − (regression slope of weight × 7,700 kcal/kg) across the last 28 days. Self-corrects for logging bias and individual metabolism.</p>
   <p><b>Weight trend</b>: gap-aware exponential moving average (10%/day) to filter water fluctuations; weekly rate via linear regression.</p>
   <p><b>Exercise</b>: Compendium MET values. Net kcal = (MET×3.5 − your own resting VO₂) × kg × min × 0.005, so resting burn isn't double counted.</p>
   <p><b>Strength</b>: e1RM = mean of Epley & Brzycki (≤10 reps), with RPE converted to reps-in-reserve.</p>
   <p><b>Body fat</b>: U.S. Navy circumference equations. <b>Nutrition</b>: USDA FoodData Central values per 100 g; recipes summed by ingredient weight.</p>
   <p class="sm">Forge is an educational tool, not medical advice. Consult a professional for medical conditions, pregnancy, or eating disorders.</p>
  </div></div>
  ${appStatusHTML()}
  <details class="card" style="margin-top:14px"><summary>Photo credits</summary><div class="credits">${[...new Map(Object.values(PHOTOS).map(p=>[p.u,p])).values()].map(p=>`<div><a href="${p.page}" target="_blank" rel="noopener">${esc(p.t.replace(/\.jpe?g$/i,''))}</a> — ${esc(p.by)} · ${esc(p.lic)}</div>`).join('')}</div><div class="tip">Photos from Wikimedia Commons under the licenses listed. They load from the internet; offline, emoji placeholders are shown instead.</div></details>`;
}
function setP(k,v){ S.profile[k]=v; save(); render(); }
function setH(){ const ft=+$('#hft').value||0, inch=+$('#hin').value||0; S.profile.heightCm=(ft*12+inch)*2.54; save(); render(); }
function exportData(){ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`forge-backup-${TODAY()}.json`; a.click(); }
function importData(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.profile) throw 0; S={...structuredClone(DEFAULT),...d,profile:{...DEFAULT.profile,...d.profile}}; migrate(); save(); toast('Imported'); render(); }catch(e){ toast('Invalid backup file'); } }; r.readAsText(file); }
async function resetAll(){ if(await askConfirm('All food, workouts, weights and settings will be erased. Export a backup first if you might want them.',{title:'Delete ALL data?',ok:'Delete everything',danger:true})){ localStorage.removeItem(KEY); S=structuredClone(DEFAULT); render(); } }
async function loadDemo(){
  if((S.weights.length||Object.keys(S.log).length) && !await askConfirm('Your current data will be replaced. Export a backup first if you want to keep it.',{title:'Load demo data?',ok:'Replace with demo',danger:true})) return;
  S=structuredClone(DEFAULT); let w=70.5; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const meals=[['r2','Breakfast',1],['r11','Lunch',1],['r4','Dinner',1],['r15','Snacks',1],['r1','Breakfast',1],['r6','Dinner',1.5],['r5','Lunch',1],['r12','Snacks',1],['r9','Dinner',1],['r7','Dinner',1]];
  for(let i=40;i>=1;i--){ const d=addDays(TODAY(),-i); const L={food:[],water:1500+r0(rnd()*1200),acts:[],sets:[]};
    w += -0.03 + (rnd()-0.5)*0.12; S.weights.push({date:d,kg:r1(w + (rnd()-0.5)*0.9)});
    if(i%7!==3){ const pick=[0,1,2,3].map(j=>meals[(i+j*3)%meals.length]); for(const[id,meal,s] of pick){ const r=recipeById(id),per=recipePer(r); L.food.push({kcal:per.kcal*s,p:per.p*s,c:per.c*s,f:per.f*s,fib:per.fib*s,name:r.name,amt:`${s} serving`,ref:'recipe:'+id,meal}); } const f=foodById('apple'); L.food.push({...foodMacros(f,182),name:f.name,amt:'1 × medium',ref:'food:apple',meal:'Snacks'}); }
    if(i%2===0){ const wk=Math.floor((40-i)/7); const plan=i%4===0?[['Back Squat',60+wk*2.5],['Bench Press',40+wk*1.25],['Barbell Row',40+wk*1.25]]:[['Deadlift',80+wk*2.5],['Overhead Press',27.5+wk],['Lat Pulldown',45+wk*1.25]];
      for(const[ex,kg] of plan) for(let s=0;s<3;s++) L.sets.push({ex,w:roundKg(kg),r:[8,8,7][s],rpe:[7,8,8.5][s],kg:true});
      const e=actKcal(6.0,50,w); L.acts.push({name:'Weight training, vigorous effort',met:6,min:50,net:e.net,gross:e.gross,strength:true}); L.wos=[{name:i%4===0?'Squat / Bench / Row':'Deadlift / Press / Pulldown',dur:50,sets:9,vol:L.sets.reduce((a,s)=>a+setVol(s),0),prs:[],kcal:e.gross,net:e.net}]; }
    else if(i%3===0){ const e=actKcal(9.8,30,w); L.acts.push({name:'Running, 6 mph (10:00 /mi)',met:9.8,min:30,net:e.net,gross:e.gross}); }
    S.log[d]=L; }
  S.measures.push({id:uid(),date:addDays(TODAY(),-35),waist:79,neck:33,hip:102,bf:navyBF('female',168,79,33,102)},{id:uid(),date:addDays(TODAY(),-7),waist:76.5,neck:33,hip:100.5,bf:navyBF('female',168,76.5,33,100.5)});
  S.shopping=[{id:'r6',serv:6},{id:'r1',serv:3}];
  S.progNext={fb3:1}; S.profile.weightKg=currentWeight(); save(); UI.date=TODAY(); toast('Demo data loaded'); render();
}

// keep recipe search focus after re-render
const _render=render; render=function(){ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart; _render(); if(id==='rq'||id==='fq'||id==='lq'){ const e=document.getElementById(id); if(e){ e.focus(); try{e.setSelectionRange(pos,pos);}catch(_){} } } };
function migrate(){ for(const L of Object.values(S.log)) for(const s of L.sets||[]) if(!s.kg){ s.w=readW(s.w||0); s.kg=true; } S.customEx??=[]; S.templates??=[]; S.progNext??={}; }
migrate();
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter' && e.target.id==='sr') addSet(); });
// ---------- App install & offline ----------
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function updateInstallBtn(){ const b=$('#installBtn'); if(b) b.style.display=isStandalone()?'none':''; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; updateInstallBtn(); if(UI.tab==='profile') render(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; updateInstallBtn(); toast('✅ Forge installed — open it from your apps'); if(UI.tab==='profile') render(); });
async function installApp(){
  if(deferredInstall){ deferredInstall.prompt(); const r=await deferredInstall.userChoice; deferredInstall=null; updateInstallBtn(); if(r.outcome==='accepted') toast('Installing Forge…'); return; }
  if(isIOS()) return ask({title:'Install on iPhone / iPad',msg:'In Safari, tap the Share button (square with an arrow), then "Add to Home Screen".',ok:'Got it',cancel:'Close'});
  ask({title:'Install Forge',msg:'In Chrome or Edge, open the browser menu (⋮) and choose "Install Forge" or "Apps → Install this site as an app". On Android, choose "Add to Home screen".',ok:'Got it',cancel:'Close'}); }
function appStatusHTML(){ const sw='serviceWorker' in navigator; return `<div class="card" style="margin-top:14px"><h3>📲 Forge app <small>${isStandalone()?'running as an installed app':'running in the browser'}</small></h3>
  <div class="row">${isStandalone()?'<span class="pill on">✓ Installed</span>':`<button class="btn" onclick="installApp()">⬇ Install Forge</button>`}<span class="pill ${sw&&navigator.serviceWorker.controller?'on':''}">${sw&&navigator.serviceWorker.controller?'✓ Works offline':'Offline mode activates after first load'}</span><span class="pill ${UI._persist?'on':''}">${UI._persist?'✓ Storage protected':'Storage: standard'}</span></div>
  <div class="tip">Installed, Forge opens in its own window with an icon on your desktop, Start menu or home screen, and works without internet — your data stays on this device. Photos are saved for offline use once you've viewed them. Long-press the icon for shortcuts (Log food, Start a workout, Recipes).</div></div>`; }
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{ reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='activated'&&navigator.serviceWorker.controller) toast('✨ Forge updated'); }); }); }).catch(()=>{});
}
navigator.storage?.persist?.().then(v=>{ UI._persist=v; }).catch(()=>{});
render(); updateInstallBtn();
</script>
