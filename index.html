<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
:root{--bg:#07080c;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f3f5f9;--mut:#8b93a7;
 --acc:#a3e635;--acc2:#4ade80;--grad:linear-gradient(135deg,#bef264 0%,#4ade80 50%,#22d3ee 100%);--p:#60a5fa;--c:#fbbf24;--f:#f472b6;--fib:#a78bfa;--warn:#fb7185;--water:#38bdf8;
 --r:20px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -20px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";
 background-image:radial-gradient(900px 500px at 10% -10%,rgba(163,230,53,.10),transparent 60%),radial-gradient(800px 600px at 110% 10%,rgba(34,211,238,.08),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(167,139,250,.07),transparent 60%);background-attachment:fixed;min-height:100vh}
::selection{background:rgba(163,230,53,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
header{display:flex;align-items:center;gap:18px;padding:12px 24px;position:sticky;top:0;z-index:30;background:rgba(7,8,12,.72);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line)}
.logo{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal;color:#06120a;font-size:16px;box-shadow:0 6px 20px -6px rgba(163,230,53,.6)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;margin-left:auto}

nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{color:var(--text);background:rgba(255,255,255,.04)}
nav button.on{background:rgba(255,255,255,.1);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
nav button.on svg{stroke:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:22px 22px 60px}
@media(max-width:860px){nav button span{display:none}nav button{padding:9px 11px}}
header{padding-top:max(12px,env(safe-area-inset-top))}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
@media (display-mode:standalone){header{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}}
@media(max-width:640px){
 #installBtn{padding:5px 10px;font-size:11.5px;margin-left:auto}
 header{padding:10px 14px;backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(7,8,12,.94)}
 nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;margin:0;justify-content:space-around;z-index:40;background:rgba(15,17,23,.88);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
 nav button{flex-direction:column;gap:3px;font-size:10px;padding:7px 6px}nav button span{display:block}
 main{padding:12px 12px calc(110px + env(safe-area-inset-bottom))}
 .wtable td,.wtable th{padding:6px 3px}.wtable input[type=number]{width:58px!important;padding:7px 6px}.wtable select{padding:7px 2px}.wtable .prevc{display:none}.wtable .btn.s{padding:5px 9px}#restbar{bottom:86px!important}
}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:190px;margin-bottom:18px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#1a2e12,#0b2530 60%,#1b1533);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);filter:saturate(1.05)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,12,.92) 0%,rgba(7,8,12,.6) 45%,rgba(7,8,12,.15) 100%),linear-gradient(0deg,rgba(7,8,12,.7),transparent 60%)}
.hero-in{position:relative;z-index:1;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;width:100%;flex-wrap:wrap}

.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:var(--acc);font-weight:700}
.hero p{margin:6px 0 0;color:#c9cfdb;max-width:520px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chipstat{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 14px;min-width:110px}
.chipstat b{display:block;font:700 22px "Space Grotesk",Inter,sans-serif;letter-spacing:-.5px}.chipstat span{font-size:11px;color:#c3c9d6;text-transform:uppercase;letter-spacing:.8px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.sp{justify-content:space-between}

select option{background:#14161d}
input[type=number]{width:92px}input[type=checkbox]{accent-color:var(--acc2);width:16px;height:16px}
input[type=date]{color-scheme:dark}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
.btn{background:var(--grad);color:#06120a;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font:700 13.5px Inter,sans-serif;box-shadow:0 8px 24px -10px rgba(163,230,53,.7);transition:transform .12s,box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 12px 28px -10px rgba(163,230,53,.8)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.g{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.g:hover{background:rgba(255,255,255,.1)}
.btn.s{padding:5px 11px;font-size:12px;border-radius:10px}
.btn.d{background:transparent;color:var(--warn);border:1px solid rgba(251,113,133,.35);box-shadow:none}
.btn.d:hover{background:rgba(251,113,133,.1)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:8px;transition:.15s}.x:hover{color:var(--text);background:rgba(255,255,255,.08)}
.stat{display:flex;flex-direction:column;gap:2px}.stat .v{font:700 24px "Space Grotesk",Inter,sans-serif;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px -2px currentColor}
.mac{margin:12px 0}.mac .row{font-size:13px;margin-bottom:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item .n{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;color:#b6bdcc;margin:2px 4px 2px 0;font-weight:500}
.pill.on{background:rgba(163,230,53,.14);color:var(--acc);border-color:rgba(163,230,53,.35);font-weight:700}
.chip{cursor:pointer;transition:.15s}.chip:hover{border-color:var(--line2);color:var(--text)}
.pr{background:rgba(251,191,36,.12);color:var(--c);border-color:rgba(251,191,36,.35);font-weight:700}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.datenav .d{font:700 17px "Space Grotesk",Inter,sans-serif;min-width:170px;text-align:center}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mut);font-size:11px;font-family:Inter,sans-serif}
.empty{color:var(--mut);padding:24px;text-align:center;border:1px dashed var(--line2);border-radius:16px;background:rgba(255,255,255,.015)}
.results{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(0,0,0,.2)}
.res{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .12s}
.res:hover,.res.on{background:rgba(163,230,53,.07)}.res:last-child{border-bottom:0}
.meal h4{margin:16px 0 6px;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);text-transform:uppercase;letter-spacing:.9px}
/* photos */
.ph{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#1d3a14,#0c2a33 55%,#231b3d);overflow:hidden}
.ph::before{content:attr(data-em);position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.rcard:hover{transform:translateY(-4px);border-color:rgba(163,230,53,.35);background:rgba(255,255,255,.05)}
.rcard:hover .ph img{transform:scale(1.07)}
.rimg{position:relative;aspect-ratio:16/10}
.rimg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,12,.55),transparent 45%);pointer-events:none}
.rbody{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.rt{font-size:15px;letter-spacing:-.2px;line-height:1.3}
.badge{position:absolute;z-index:2;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(7,8,12,.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)}
.badge.tl{top:10px;left:10px}.badge.tr{top:10px;right:10px}.badge.ok{background:rgba(163,230,53,.9);color:#06120a;border-color:transparent}
.badge.bl{bottom:10px;left:10px;font-size:20px;padding:2px 8px}
.excard .exthumb{height:96px;position:relative}
.excard .exthumb .ph::before{font-size:30px}
.excard .exthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,12,.85),rgba(7,8,12,.15))}
.pcard{padding:0;overflow:hidden}.pcard>*:not(.pimg){margin-left:20px;margin-right:20px}.pcard>*:last-child{margin-bottom:18px}
.pimg{position:relative;height:150px;margin-bottom:14px}
.pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,12,.95),rgba(7,8,12,.1) 70%)}
.pcap{position:absolute;left:20px;bottom:14px;right:20px;z-index:1;display:flex;flex-direction:column}
.pcap b{font:700 21px "Space Grotesk",Inter,sans-serif;letter-spacing:-.5px}.pcap span{font-size:12px;color:var(--acc);font-weight:600}
.thumb{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;display:inline-block}.thumb .ph::before{font-size:18px}
.mhero{position:relative;height:240px;margin:-20px -20px 16px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.mhero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,16,22,1),rgba(14,16,22,0) 60%)}
.mhero .close{position:absolute;top:12px;right:12px;z-index:2;background:rgba(7,8,12,.6);backdrop-filter:blur(8px);font-size:18px;width:36px;height:36px;border-radius:50%;color:#fff}
.mhero h2{position:absolute;left:22px;bottom:6px;z-index:2;margin:0;font-size:28px}
.snapbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.snapbar .btn{justify-content:center;padding:14px 8px;font-size:15px;min-width:0;white-space:nowrap}
.snapimg{width:100%;max-height:260px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.snapitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.snapitem input[type=number]{width:78px}
.conf{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);text-transform:uppercase;letter-spacing:.5px}

.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:spin 0.8s linear infinite;margin:18px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.mrow div{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.mrow b{display:block;font:700 16px "Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums}.mrow span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(3,4,7,.7);backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 12px;animation:fade .2s}
.modal>.card{max-width:780px;width:100%;background:#0e1016;border-color:var(--line2);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
td.r,th.r{text-align:right}
.note{background:linear-gradient(135deg,rgba(163,230,53,.09),rgba(34,211,238,.05));border:1px solid rgba(163,230,53,.22);color:#dff7c4;padding:11px 14px;border-radius:14px;font-size:13px}
.note.w{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(251,113,133,.06));border-color:rgba(251,191,36,.28);color:#fde6c4}
.tip{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.55}
ol.steps{padding-left:0;list-style:none;counter-reset:s}ol.steps li{counter-increment:s;margin-bottom:10px;padding-left:38px;position:relative;min-height:26px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:rgba(163,230,53,.14);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px}
.toast{position:fixed;top:76px;left:50%;transform:translate(-50%,-10px);background:rgba(20,24,18,.92);backdrop-filter:blur(14px);color:var(--text);border:1px solid rgba(163,230,53,.4);padding:11px 18px;border-radius:14px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ringwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ringwrap svg text{font-family:"Space Grotesk",Inter,sans-serif}
#restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(580px,94vw);background:rgba(10,24,32,.85);backdrop-filter:blur(18px);border:1px solid rgba(56,189,248,.35);border-radius:18px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:40;box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
.pill.burn{color:#fdba74;border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.1);font-weight:700}
.sect{font:700 20px "Space Grotesk",Inter,sans-serif;letter-spacing:-.4px;margin:4px 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sect small{font:500 12px Inter,sans-serif;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.card summary{cursor:pointer;font-weight:700}
.credits{font-size:12px;color:var(--mut);columns:2 320px;column-gap:28px;margin-top:10px}.credits div{break-inside:avoid;margin-bottom:6px}.credits a{color:#c5d1e0}
a{color:var(--acc)}
.anim>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}.anim>*:nth-child(n+5){animation-delay:.16s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>⚒</i><b>Forge<span>.</span></b></div>
  <nav id="nav"></nav>
  <button id="installBtn" class="btn s" style="display:none" onclick="installApp()" title="Install Forge as an app">⬇ Install app</button>
</header>
<main id="app"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<div id="restbar"></div>

<script>
/* =========================================================
   FORGE — Fitness, Nutrition & Recipes (single-file, offline)
   All data stays in your browser (localStorage).
   ========================================================= */

// ---------- Food database (per 100 g; values based on USDA FoodData Central) ----------
// [id, name, kcal, protein, carbs, fat, fiber, servingLabel, servingGrams, category]
const FOOD_DB = [
 ['chk_raw','Chicken breast, skinless, raw',120,22.5,0,2.6,0,'breast (174 g)',174,'Protein'],
 ['chk_ckd','Chicken breast, skinless, cooked',165,31,0,3.6,0,'breast (120 g)',120,'Protein'],
 ['turk93','Ground turkey 93% lean, raw',150,18.7,0,8.3,0,'4 oz (113 g)',113,'Protein'],
 ['beef90','Ground beef 90% lean, raw',176,20,0,10,0,'4 oz (113 g)',113,'Protein'],

function ask({title='',msg='',ok='OK',cancel='Cancel',danger=false,fields=null}){ return new Promise(res=>{
  const d=document.createElement('div'); d.className='modal dlg'; d.style.zIndex=90;
  d.innerHTML=`<div class="card" style="max-width:420px"><h3 style="margin-bottom:6px">${esc(title||msg)}</h3>${title&&msg?`<div class="mut" style="margin-bottom:12px">${esc(msg)}</div>`:'<div style="height:6px"></div>'}
   ${(fields||[]).map((f,i)=>`<label style="margin-bottom:10px">${esc(f.label||'')}<input data-i="${i}" type="${f.type||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" style="width:100%"></label>`).join('')}
   <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn g" data-a="0">${esc(cancel)}</button><button class="btn ${danger?'d':''}" data-a="1">${esc(ok)}</button></div></div>`;
  const done=v=>{ d.remove(); document.removeEventListener('keydown',key,true); res(v); };
  const val=()=>fields?[...d.querySelectorAll('input')].map(i=>i.value):true;
  const key=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(null);} if(e.key==='Enter'){ e.preventDefault(); done(val()); } };
  d.addEventListener('click',e=>{ const a=e.target.closest('[data-a]'); if(a) done(a.dataset.a==='1'?val():null); else if(e.target===d) done(null); });
  document.addEventListener('keydown',key,true); document.body.appendChild(d); (d.querySelector('input')||d.querySelector('[data-a="1"]')).focus(); d.querySelector('input')?.select?.();
}); }

function sortedWeights(){ return [...S.weights].sort((a,b)=>a.date<b.date?-1:1); }
// Exponentially smoothed trend (10%/day), gap-aware — filters out water-weight noise
function weightTrend(){
  const ws = sortedWeights(); let t=null, prev=null; const out=[];
  for(const w of ws){ if(t===null) t=w.kg; else { const gap=Math.max(1,dnum(w.date)-dnum(prev)); const a=1-Math.pow(0.9,gap); t=t+a*(w.kg-t); } prev=w.date; out.push({date:w.date,kg:w.kg,trend:t}); }
  return out;
}
function currentWeight(){ const t=weightTrend(); return t.length ? t[t.length-1].trend : S.profile.weightKg; }
function linreg(pts){ const n=pts.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0; for(const[x,y] of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;} const d=n*sxx-sx*sx; if(!d) return null; const m=(n*sxy-sx*sy)/d; return {m, b:(sy-m*sx)/n}; }
function weeklyRate(days=21){ const end=dnum(TODAY()); const pts=sortedWeights().filter(w=>end-dnum(w.date)<=days).map(w=>[dnum(w.date),w.kg]); if(pts.length<3) return null; const span=pts[pts.length-1][0]-pts[0][0]; if(span<6) return null; const lr=linreg(pts); return lr? lr.m*7 : null; }

}
// Adaptive TDEE: energy balance from your own intake + weight trend (needs ≥14 days, ≥10 logged)
function adaptiveTDEE(){
  const end=TODAY(); const N=28; let kc=[], first=null;
  for(let i=1;i<=N;i++){ const d=addDays(end,-i); const L=S.log[d]; if(L && L.food && L.food.length){ const k=sumM(L.food).kcal; if(k>500){kc.push(k); first=d;} } }
  if(kc.length<10) return null;
  const startN=dnum(addDays(end,-N)); const pts=sortedWeights().filter(w=>dnum(w.date)>=startN).map(w=>[dnum(w.date),w.kg]);
  if(pts.length<5 || pts[pts.length-1][0]-pts[0][0]<14) return null;
  const lr=linreg(pts); const avg=kc.reduce((a,b)=>a+b,0)/kc.length;
  const tdee = avg - lr.m*KCAL_PER_KG;
  return {tdee, avgIntake:avg, days:kc.length, slopeWk:lr.m*7, confidence: kc.length>=21 && pts.length>=12 ? 'high' : 'moderate'};
}
function navyBF(sex,hCm,waist,neck,hip){
  if(sex==='male'){ if(waist<=neck) return null; return 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(hCm))-450; }
  if(!hip || waist+hip<=neck) return null; return 495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(hCm))-450;
}
function targets(){
  const p=S.profile, kg=currentWeight(); const bi=bmrInfo(kg); const formula=bi.bmr*p.activity;
  const ad=adaptiveTDEE(); const useAd = p.useAdaptive && ad; const tdee = useAd ? ad.tdee : formula;
  const delta = p.goal==='lose' ? -p.rate*KCAL_PER_KG/7 : p.goal==='gain' ? p.rate*KCAL_PER_KG/7 : 0;
  const floor = p.sex==='male'?1500:1200; let kcal = Math.max(floor, tdee+delta); const floored = tdee+delta<floor;
  const hM=p.heightCm/100, bmi=kg/(hM*hM);
  const refKg = bmi>30 ? 25*hM*hM : kg; // protein from adjusted weight if BMI>30
  const protein = p.proteinPerKg*refKg; const fat = Math.max(kcal*p.fatPct, 0.5*kg*9)/9;
  const carbs = Math.max(0,(kcal-protein*4-fat*9)/4);
  return {bmr:bi.bmr, method:bi.method, formula, ad, useAd, tdee, kcal, floored, delta, protein, fat, carbs, fiber:14*kcal/1000, water:35*kg, bmi, kg};
}
// Net exercise calories: subtracts your own resting rate so BMR isn't double-counted
function actKcal(met, min, kg=currentWeight()){
  const rmrMl = bmrInfo(kg).bmr/1440/5*1000/kg; // ml O2/kg/min (≈ individual 1 MET)
  const gross = met*3.5*kg*min*0.005; const net = Math.max(0,(met*3.5-rmrMl))*kg*min*0.005;
  return {gross, net};
}
// e1RM: avg of Epley & Brzycki ≤10 reps, Epley above; RPE adds reps-in-reserve
function e1rm(w,r,rpe){ if(!w||!r) return 0; let reps=r+(rpe? clamp(10-rpe,0,5):0); if(reps<=1) return w; return reps<=10 ? (w*(1+reps/30)+w*36/(37-reps))/2 : w*(1+reps/30); }
function dayTotals(d){ const L=peekDay(d); const food=sumM(L.food||[]); const ex=(L.acts||[]).reduce((a,x)=>a+x.net,0); return {food, ex, water:L.water||0}; }

// ---------- Charts (hand-rolled SVG) ----------
function lineChart(series,{h=220,yfmt=v=>r1(v),xfmt=x=>x,W=640}={}){
  const all=series.flatMap(s=>s.pts); if(all.length<2) return '<div class="empty">Log at least two entries to see a chart</div>';
  const pl=46,pr=12,pt=12,pb=26; let xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs); if(x0===x1){x0-=1;x1+=1;}
  let y0=Math.min(...ys),y1=Math.max(...ys); const pad=(y1-y0)*0.12||1; y0-=pad; y1+=pad;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(h-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){ const v=y0+(y1-y0)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${yfmt(v)}</text>`; }
  for(let i=0;i<=4;i++){ const v=x0+(x1-x0)*i/4; g+=`<text x="${X(v)}" y="${h-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${xfmt(Math.round(v))}</text>`; }
  for(const s of series){
    if(!s.pts.length) continue;
    if(s.line) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''} points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
    if(s.dots) g+=s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r||3}" fill="${s.color}" opacity="${s.op||1}"><title>${xfmt(p[0])}: ${yfmt(p[1])}</title></circle>`).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
const dayLabel = n => shortDate(new Date(n*864e5).toISOString().slice(0,10));
function barChart(items,target,{h=200,W=640}={}){
  const pl=46,pr=12,pt=12,pb=26; const mx=Math.max(target*1.25, ...items.map(i=>i.v), 100);
  const bw=(W-pl-pr)/items.length; const Y=v=>pt+(1-v/mx)*(h-pt-pb); let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${r0(v)}</text>`; }
  items.forEach((it,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64; const col = !it.v ? '#2a2f3a' : it.v>it.t*1.05 ? 'var(--warn)' : it.v<it.t*0.85 ? 'var(--c)' : 'var(--acc)';
    g+=`<rect x="${x}" y="${Y(it.v)}" width="${w}" height="${Math.max(0,Y(0)-Y(it.v))}" rx="4" fill="${col}"><title>${it.l}: ${r0(it.v)} / ${r0(it.t)} kcal</title></rect><text x="${x+w/2}" y="${h-6}" text-anchor="middle">${it.l}</text>`;
    g+=`<line x1="${pl+i*bw+2}" x2="${pl+(i+1)*bw-2}" y1="${Y(it.t)}" y2="${Y(it.t)}" stroke="#e9ecf2" stroke-dasharray="4 3" opacity=".6"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
function ring(val,max,size=150,color='var(--acc)',label='',sub=''){
  const r=size/2-12, C=2*Math.PI*r, pct=max?clamp(val/max,0,1):0; const over=val>max;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="12" fill="none"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${over?'var(--warn)':color}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" opacity="${pct>0?1:0}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="47%" text-anchor="middle" fill="#e9ecf2" font-size="${size/6}" font-weight="800">${label}</text><text x="50%" y="62%" text-anchor="middle" fill="#98a1b1" font-size="${size/13}">${sub}</text></svg>`;
}

function guessMeal(){ const h=new Date().getHours(); return h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snacks'; }

function setUnit(u){ const f=foodById(UI.sel.id); if(u==='g'&&UI.sel.unit!=='g') UI.sel.amt=r0(UI.sel.amt*f.sg); if(u==='sv'&&UI.sel.unit==='g') UI.sel.amt=r1(UI.sel.amt/f.sg)||1; UI.sel.unit=u; render(); }
function addSel(){ const sel=UI.sel; if(!sel||!(sel.amt>0)) return toast('Enter an amount'); const meal=UI.meal||guessMeal(); let e;
  if(sel.type==='food'){ const f=foodById(sel.id); const g=sel.unit==='g'?sel.amt:sel.amt*f.sg; e={...foodMacros(f,g), name:f.name, amt: sel.unit==='g'? `${r1(g)} g` : `${sel.amt} × ${f.sv}`, ref:'food:'+f.id, meal}; }
  else { const r=recipeById(sel.id), per=recipePer(r); e={kcal:per.kcal*sel.amt,p:per.p*sel.amt,c:per.c*sel.amt,f:per.f*sel.amt,fib:per.fib*sel.amt,name:r.name,amt:`${sel.amt} serving${sel.amt==1?'':'s'}`,ref:'recipe:'+r.id,meal}; }
  day().food.push(e); save(); UI.sel=null; UI.q=''; toast(`Added to ${meal}`); render(); }
function copyDay(n){ const src=peekDay(addDays(UI.date,n)); if(!src.food.length) return toast('Nothing to copy'); day().food.push(...src.food.map(x=>({...x}))); save(); toast(`Copied ${src.food.length} items`); render(); }
async function quickAdd(){ const r=await ask({title:'Quick-add calories',fields:[{label:'Calories (kcal)',type:'number',placeholder:'e.g. 350'},{label:'Protein grams (optional)',type:'number',placeholder:'0'}],ok:'Add'}); if(!r) return; const k=+r[0]; if(!(k>0)) return toast('Enter calories'); const p=+r[1]||0; day().food.push({name:'Quick add',amt:'manual',kcal:k,p,c:0,f:0,fib:0,meal:UI.meal||guessMeal()}); save(); render(); }
function addCustomFood(){ const v=id=>+$('#'+id).value||0; const n=$('#cf_n').value.trim(); if(!n) return toast('Name required'); const sg=v('cf_sg')||100; const div=$('#cf_perserv').checked? sg/100 : 1;
  S.foods.push({id:'c_'+uid(),name:n,k:r1(v('cf_k')/div),p:r1(v('cf_p')/div),c:r1(v('cf_c')/div),f:r1(v('cf_f')/div),fib:r1(v('cf_fib')/div),sv:($('#cf_sv').value||'serving')+` (${sg} g)`,sg,cat:'Custom',custom:true}); save(); toast('Custom food saved'); render(); }
function delCustomFood(id){ S.foods=S.foods.filter(f=>f.id!==id); save(); render(); }

// Two providers: Google Gemini (free tier, default) or Anthropic Claude (paid).
// Keys live only on this device (separate localStorage keys, never in backups/exports).
const SNAP_PROVIDERS={
  gemini:{name:'Google Gemini',tag:'free',store:'forge.geminiKey',model:'gemini-3.8-flash',prefix:/^(AIza[0-9A-Za-z_-]{20,}|AQ.[0-9A-Za-z_.-]{20,})$/,placeholder:'AIza… or AQ.…',
    url:'https://aistudio.google.com/app/apikey',how:'Sign in to Google AI Studio → Get API key → Create API key.',
    note:'Free tier: no cost, a daily request limit, and Google may use free-tier photos to improve its products.'},
  anthropic:{name:'Anthropic Claude',tag:'paid',store:'forge.anthropicKey',model:'claude-opus-5-5',prefix:/^sk-ant-/,placeholder:'sk-ant-…',
    url:'https://console.anthropic.com/settings/keys',how:'Create one at console.anthropic.com → API keys (needs account credit).',
    note:'Paid: roughly 1–2 cents per photo on your Anthropic account.'}};
const ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k)||''; v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch(e){ return ''; } };
const snapProv=()=>{ const p=ls('forge.snapProvider'); return SNAP_PROVIDERS[p]?p:(ls(SNAP_PROVIDERS.anthropic.store)&&!ls(SNAP_PROVIDERS.gemini.store)?'anthropic':'gemini'); };
const getSnapKey=(p=snapProv())=>ls(SNAP_PROVIDERS[p].store);
const setSnapKey=(k,p=snapProv())=>ls(SNAP_PROVIDERS[p].store,k||'');
function setSnapProv(p){ ls('forge.snapProvider',p); render(); if(SNAP) drawSnap(); }
// Built-in scanner: Forge's own Cloudflare Worker holds the Gemini key server-side, so users never need one.
const SNAP_WORKER='https://forge-snap.michellepantelouris.workers.dev';
const SNAP_BUILTIN=/^https:\/\/[^/]+\.workers\.dev$/.test(SNAP_WORKER)&&!SNAP_WORKER.includes('REPLACE_ME');
const snapReady=()=>SNAP_BUILTIN||!!getSnapKey();
let SNAP=null; // {img, hint, status:'idle'|'busy'|'done'|'err', items:[], note, err}

function snapSettingsHTML(){ if(SNAP_BUILTIN) return `<div class="card" style="margin-top:14px"><h3>📷 Food photo scanner <small>built in</small></h3><div class="row"><span class="pill on">✓ Ready — no setup needed</span></div><div class="tip">Snap a meal on the Food Log and Forge identifies each food, estimates the portion and works out calories and macros. Photos are analysed by Google Gemini and aren't stored by Forge.</div></div>`;
  const cur=snapProv();
  return `<div class="card" style="margin-top:14px"><h3>📷 Food photo scanner <small>${getSnapKey()?'ready':'needs a key'}</small></h3>
  <div class="mut sm" style="margin-bottom:10px">Snap a meal on the Food Log and Forge identifies each food, estimates the portion and works out calories and macros. Choose which AI analyses your photos. Your key is stored only on this device and never included in backups.</div>
  <div class="list" style="gap:8px">${Object.entries(SNAP_PROVIDERS).map(([id,P])=>{ const k=getSnapKey(id); return `<div class="snapitem" style="grid-template-columns:auto 1fr"><input type="radio" name="snapprov" ${id===cur?'checked':''} onchange="setSnapProv('${id}')">
    <div><div class="n"><b>${P.name}</b> <span class="conf ${P.tag==='free'?'high':''}">${P.tag}</span></div><div class="mut sm">${P.note}</div>
    <div class="row" style="margin-top:8px">${k?`<span class="pill on">✓ Key saved (…${esc(k.slice(-4))})</span><button class="btn g s" onclick="snapSetKey('${id}')">Change</button><button class="btn d s" onclick="setSnapKey('','${id}');render()">Remove</button>`:`<button class="btn s" onclick="snapSetKey('${id}')">Add key</button><a class="btn g s" href="${P.url}" target="_blank" rel="noopener">Get a ${P.tag==='free'?'free ':''}key ↗</a>`}</div></div></div>`; }).join('')}</div></div>`; }

async function snapSetKey(p=snapProv()){ const P=SNAP_PROVIDERS[p]; const r=await ask({title:`${P.name} API key`,msg:`${P.how} Then paste it here — it stays on this device only.`,fields:[{label:'API key',type:'password',placeholder:P.placeholder}],ok:'Save'}); if(!r) return false; const k=(r[0]||'').trim(); if(!P.prefix.test(k)){ toast(`That doesn't look like a ${P.name} key`); return false; } setSnapKey(k,p); ls('forge.snapProvider',p); toast('Key saved'); render(); return true; }

// Downscale to ≤1280px JPEG so uploads are small and fast.
function snapResize(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error('Could not read the photo')); fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error('That file isn\'t a photo Forge can read')); im.onload=()=>{ const M=1280, sc=Math.min(1, M/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85)); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

async function snapFile(inp){ const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  try{ const img=await snapResize(f); SNAP={img,hint:'',status:'idle',items:[],note:''}; drawSnap(); if(snapReady()) snapRun(); }
  catch(e){ toast(e.message); } }

const SNAP_SCHEMA={type:'object',additionalProperties:false,required:['is_food','items','notes'],properties:{
  is_food:{type:'boolean'},
  notes:{type:'string'},
  items:{type:'array',items:{type:'object',additionalProperties:false,
    required:['name','grams','kcal_per_100g','protein_per_100g','carbs_per_100g','fat_per_100g','fiber_per_100g','confidence'],
    properties:{name:{type:'string'},grams:{type:'number'},kcal_per_100g:{type:'number'},protein_per_100g:{type:'number'},carbs_per_100g:{type:'number'},fat_per_100g:{type:'number'},fiber_per_100g:{type:'number'},confidence:{type:'string',enum:['high','medium','low']}}}}}};

const SNAP_PROMPT=`You are a registered dietitian estimating the nutrition of a meal from a photo for a calorie-tracking app.
List each distinct food or drink you can see as its own item (e.g. "grilled chicken breast", "white rice, cooked", "olive oil / butter used in cooking" when visibly glossy or fried).
For each item estimate the edible portion in grams as eaten (cooked weight for cooked foods), using plate size (~26 cm dinner plate), cutlery, hands and packaging for scale.
Give energy and macros per 100 g using USDA FoodData Central style values for that food as prepared. Include hidden calories you can reasonably infer (oil, dressing, sauce, cheese, sugar in drinks).
Set confidence to high, medium or low for each item based on how sure you are of both identity and portion.
If the picture is a nutrition label or packaged product, use the label's values. If there is no food in the image, set is_food to false and return no items.
Use notes for one or two short sentences the user should know (assumptions made, what to double-check). Use plain everyday food names.`;

function snapErr(status,msg,P){ msg=msg||'';
  if(status===401||status===403||/API key not valid|invalid x-api-key|API_KEY_INVALID/i.test(msg)) return `Your ${P.name} key was rejected — check it in Profile → Food photo scanner.`;
  if(status===429) return P.tag==='free'?'You\'ve reached the free daily limit for photo scans. Try again later or tomorrow.':'Too many requests right now — wait a moment and try again.';
  if(/credit/i.test(msg)) return 'Your Anthropic account has no credit left. Add credit at console.anthropic.com.';
  return msg||`The scanner returned an error (${status}).`; }

async function snapCallAnthropic(key,P,b64,userText){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:P.model,max_tokens:16000,fallbacks:'default',output_config:{effort:'medium',format:{type:'json_schema',schema:SNAP_SCHEMA}},system:SNAP_PROMPT,
      messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:userText}]}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(snapErr(r.status,j?.error?.message,P));
  if(j.stop_reason==='refusal') throw new Error('The scanner couldn\'t analyse this photo. Try another angle or add the food manually.');
  return (j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''); }

async function snapCallGemini(key,P,b64,userText,withSchema=true){
  const gen={responseMimeType:'application/json'}; if(withSchema) gen.responseJsonSchema=SNAP_SCHEMA;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${P.model}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({systemInstruction:{parts:[{text:SNAP_PROMPT+(withSchema?'':'\nReply with JSON only, matching exactly this JSON Schema: '+JSON.stringify(SNAP_SCHEMA))}]},
      contents:[{role:'user',parts:[{inlineData:{mimeType:'image/jpeg',data:b64}},{text:userText}]}],generationConfig:gen})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const m=j?.error?.message||''; if(withSchema&&r.status===400&&/schema|responseJsonSchema|Unknown name/i.test(m)) return snapCallGemini(key,P,b64,userText,false); throw new Error(snapErr(r.status,m,P)); }
  const c=j.candidates&&j.candidates[0];
  if(!c){ throw new Error(j.promptFeedback?.blockReason?'The scanner couldn\'t analyse this photo. Try another angle or add the food manually.':'The scanner gave no answer — please try again.'); }
  return (c.content?.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join(''); }

async function snapCallWorker(b64,hint){
  const r=await fetch(SNAP_WORKER+'/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:b64,hint})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message||`The scanner returned an error (${r.status}).`);
  return JSON.stringify(j); }

async function snapRun(){ if(!SNAP) return; if(!snapReady()){ if(!(await snapSetKey())) return; }
  const cur=SNAP; if(!cur) return; cur.status='busy'; cur.err=''; drawSnap();
  const prov=snapProv(), P=SNAP_PROVIDERS[prov], hint=(cur.hint||'').trim();
  const userText=hint?`Extra details from the user: ${hint}`:'Estimate the nutrition of this meal.';
  try{
    const b64=cur.img.split(',')[1];
    const txt=SNAP_BUILTIN?await snapCallWorker(b64,hint):await (prov==='gemini'?snapCallGemini:snapCallAnthropic)(getSnapKey(prov),P,b64,userText);
    let out; try{ out=JSON.parse(txt.replace(/^\s*```(?:json)?|```\s*$/g,'')); }catch(e){ throw new Error('The scanner\'s answer was cut off — please try again.'); }
    const items=Array.isArray(out.items)?out.items.filter(x=>x&&x.name&&x.grams>0):[];
    if(out.is_food===false||!items.length){ cur.status='err'; cur.err='No food found in this photo. Try again with the meal filling more of the frame.'; if(SNAP===cur) drawSnap(); return; }
    const n=v=>Math.max(0,+v||0);
    cur.items=items.map(x=>({name:String(x.name),grams:Math.max(1,Math.round(x.grams)),kcal_per_100g:n(x.kcal_per_100g),protein_per_100g:n(x.protein_per_100g),carbs_per_100g:n(x.carbs_per_100g),fat_per_100g:n(x.fat_per_100g),fiber_per_100g:n(x.fiber_per_100g),confidence:['high','medium','low'].includes(x.confidence)?x.confidence:'medium',on:true}));
    cur.note=out.notes||''; cur.status='done'; cur.by=SNAP_BUILTIN?'Google Gemini':P.name;
  }catch(e){ cur.status='err'; cur.err=(e instanceof TypeError)?'Couldn\'t reach the scanner — check your internet connection.':e.message; }
  if(SNAP===cur) drawSnap(); }

function snapMacros(x){ const m=x.grams/100; return {kcal:x.kcal_per_100g*m,p:x.protein_per_100g*m,c:x.carbs_per_100g*m,f:x.fat_per_100g*m,fib:x.fiber_per_100g*m}; }
function snapTotal(){ return (SNAP?.items||[]).filter(x=>x.on).map(snapMacros).reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,fib:a.fib+m.fib}),{kcal:0,p:0,c:0,f:0,fib:0}); }

function drawSnap(){ if(!SNAP){ closeModal(); return; } const S_=SNAP, t=snapTotal(), meal=UI.meal||guessMeal();
  let body='';
  if(S_.status==='busy') body=`<div class="spin"></div><div class="mut" style="text-align:center">Identifying foods and estimating portions… (usually 5–30 seconds)</div>`;
  else if(S_.status==='err') body=`<div class="note w" style="margin-top:12px">${esc(S_.err)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="snapRun()">Try again</button></div>`;
  else if(S_.status==='idle'){ const P=SNAP_PROVIDERS[snapProv()]; body=snapReady()?'':`<div class="note" style="margin-top:12px">To analyse photos, add a <b>${P.name}</b> API key once${P.tag==='free'?' — it\'s free, no card needed':''}. ${esc(P.how)}</div><div class="row" style="margin-top:12px"><a class="btn g" href="${P.url}" target="_blank" rel="noopener">1. Get a ${P.tag==='free'?'free ':''}key ↗</a><button class="btn" onclick="snapRun()">2. Paste key & analyse</button></div><div class="tip">Prefer ${P.tag==='free'?'Claude (paid)':'Gemini (free)'}? <a href="#" onclick="event.preventDefault();setSnapProv('${snapProv()==='gemini'?'anthropic':'gemini'}')">Switch</a></div>`; }
  else body=`<div class="list" style="gap:8px;margin-top:12px">${S_.items.map((x,i)=>{ const m=snapMacros(x); return `<div class="snapitem"><input type="checkbox" ${x.on?'checked':''} onchange="SNAP.items[${i}].on=this.checked;drawSnap()">
     <div><div class="n"><b>${esc(x.name)}</b> <span class="conf ${x.confidence}">${x.confidence}</span></div><div class="mut sm">${r0(m.kcal)} kcal · P ${r1(m.p)} · C ${r1(m.c)} · F ${r1(m.f)}</div></div>
     <label class="sm" style="flex-direction:row;align-items:center;gap:6px"><input type="number" min="1" step="5" value="${x.grams}" onchange="SNAP.items[${i}].grams=Math.max(0,+this.value||0);drawSnap()"> g</label></div>`; }).join('')}</div>
    ${S_.note?`<div class="tip">💡 ${esc(S_.note)}</div>`:''}
    <div class="mrow" style="margin-top:14px"><div><b>${r0(t.kcal)}</b><span>kcal</span></div><div><b style="color:var(--p)">${r1(t.p)}g</b><span>protein</span></div><div><b style="color:var(--c)">${r1(t.c)}g</b><span>carbs</span></div><div><b style="color:var(--f)">${r1(t.f)}g</b><span>fat</span></div></div>
    <div class="row" style="margin-top:14px"><label>Meal<select onchange="UI.meal=this.value">${MEALS.map(x=>`<option ${x===meal?'selected':''}>${x}</option>`).join('')}</select></label>
    <button class="btn" style="align-self:flex-end" onclick="snapAdd()" ${S_.items.some(x=>x.on)?'':'disabled'}>Add ${r0(t.kcal)} kcal to log</button></div>
    <div class="tip">Analysed by ${esc(S_.by||'AI')}. Portions are estimates — adjust the grams if you know better. Accuracy is typically within 15–25%, so weigh foods when precision matters.</div>`;
  $('#modal').innerHTML=`<div class="modal"><div class="card" style="max-width:560px"><div class="row sp"><h2 style="margin:0">📷 Food scan</h2><button class="x" style="font-size:22px" onclick="SNAP=null;closeModal()">✕</button></div>
   <img class="snapimg" style="margin-top:12px" src="${S_.img}" alt="Your meal">
   ${S_.status!=='busy'?`<div class="row" style="margin-top:12px"><input id="snaphint" style="flex:1;min-width:180px" placeholder="Optional details, e.g. 2 eggs fried in butter, large bowl" value="${esc(S_.hint)}" oninput="SNAP.hint=this.value">${S_.status!=='idle'||snapReady()?`<button class="btn g s" onclick="snapRun()">${S_.status==='done'?'Re-analyse':'Analyse'}</button>`:''}</div>`:''}
   ${body}</div></div>`; }

function snapAdd(){ if(!SNAP) return; const meal=UI.meal||guessMeal(); const items=SNAP.items.filter(x=>x.on&&x.grams>0); if(!items.length) return toast('Nothing selected');
  for(const x of items) day().food.push({...snapMacros(x),name:x.name,amt:`${r0(x.grams)} g · 📷 photo estimate`,meal});
  save(); SNAP=null; closeModal(); toast(`Added ${items.length} item${items.length>1?'s':''} to ${meal}`); render(); }

// ---------- TRAINING: calories ----------
// Compendium of Physical Activities: resistance training 3.5 (moderate) / 6.0 (vigorous); circuit training 4.3 (moderate) / 8.0 (vigorous, minimal rest)
// Compendium of Physical Activities METs (moderate / vigorous) per session type
const KIND_MET={strength:[3.5,6.0],circuit:[4.3,8.0],cardio:[5.0,8.0],mobility:[2.5,4.0]};
const KIND_LABEL={strength:'💪 Strength',circuit:'⚡ Circuit',cardio:'❤️ Cardio',mobility:'🧘 Mobility'};
const KIND_ACT={strength:'Weight training',circuit:'Circuit training',cardio:'Cardio session',mobility:'Yoga & mobility'};
function workoutMET(kind,effort,avgRpe){ const T=KIND_MET[kind]||KIND_MET.strength; const vig=effort==='vigorous'||(effort!=='moderate'&&(avgRpe!=null?avgRpe>=8:kind==='circuit')); return vig?T[1]:T[0]; }
// Heart-rate method — Keytel et al. 2005 (J Sports Sci): uses your HR, age, sex, weight and, if known, VO2max. Valid for exercise HR (~90+ bpm).
function hrBurnPerMin(hr,kg=currentWeight()){ const p=S.profile, a=+p.age||30, v=+p.vo2max||0; if(!(hr>=90&&hr<=220)) return null;
  const k = v>10 ? (p.sex==='male' ? -95.7735+0.634*hr+0.404*v+0.394*kg+0.271*a : -59.3954+0.45*hr+0.380*v+0.103*kg+0.274*a)
                 : (p.sex==='male' ? -55.0969+0.6309*hr+0.1988*kg+0.2017*a : -20.4022+0.4472*hr-0.1263*kg+0.074*a);
  return Math.max(0,k/4.184); }
// Personal burn: HR method when an exercise heart rate is given, otherwise METs; net subtracts YOUR resting burn (BMR from age/sex/height/body fat)
function burn(met,min,hr){ const kg=currentWeight(); const rest=bmrInfo(kg).bmr/1440*min; const m=hrBurnPerMin(+hr,kg);
  if(m!=null){ const gross=m*min; return {gross,net:Math.max(0,gross-rest),method:'hr',hr:+hr}; }
  return {...actKcal(met,min,kg),method:'met'}; }
function profileTag(){ const p=S.profile; return `${fw(currentWeight())} · ${p.age} y · ${p.sex==='male'?'male':'female'} · ${r0(showL(p.heightCm))} ${lU()}${p.bodyFat?` · ${p.bodyFat}% fat`:''}`; }
function estWorkout(ex,kind='strength'){ const T=KIND_MET[kind]||KIND_MET.strength; let sec=0; for(const [n,sets,lo,hi,rest] of ex){ const x=exInfo(n); const work=x.time?(lo+hi)/2:((lo+hi)/2)*3.5+10; sec+=sets*(work+(rest??60)); } const min=Math.round(sec/60)+5;
  const lo=actKcal(T[0],min).gross, hi=actKcal(T[1],min).gross; return {min,lo:Math.round(lo/5)*5,hi:Math.round(hi/5)*5}; }
function estHTML(ex,kind){ const e=estWorkout(ex,kind); return `<span class="pill">⏱ ~${e.min} min</span><span class="pill burn" title="Personalised for ${esc(profileTag())}">🔥 ${e.lo}–${e.hi} kcal for you</span>`; }
function burnedDay(d){ let gross=0,net=0,strength=0; for(const a of peekDay(d).acts||[]){ const g=a.gross??a.net; gross+=g; net+=a.net; if(isStrengthAct(a)) strength+=g; } return {gross,net,strength}; }
function avgRpeActive(){ const r=S.active.items.flatMap(it=>it.sets.filter(s=>s.done&&!s.warm&&s.rpe)); return r.length?r.reduce((a,s)=>a+s.rpe,0)/r.length:null; }
function liveKcal(){ const A=S.active; return burn(workoutMET(A.kind,A.effort,avgRpeActive()),(Date.now()-A.start)/60000,A.hr); }
function burnChart(n=14){ const items=[...Array(n)].map((_,i)=>{ const d=addDays(TODAY(),i-n+1); const b=burnedDay(d); return {d,g:b.gross,s:b.strength}; }); const mx=Math.max(100,...items.map(i=>i.g)); const W=640,H=160,pl=40,pb=22,top=8,bw=(W-pl)/n; let g='';
  for(let k=0;k<=2;k++){ const y=H-pb-(H-pb-top)*k/2; g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${r0(mx*k/2)}</text>`; }
  items.forEach((it,i)=>{ const h=(H-pb-top)*it.g/mx, hs=(H-pb-top)*it.s/mx, x=pl+i*bw+bw*.18, w=bw*.64; g+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${h}" rx="4" fill="#fb923c"><title>${shortDate(it.d)}: ${r0(it.g)} kcal burned</title></rect>${hs?`<rect x="${x}" y="${H-pb-hs}" width="${w}" height="${hs}" rx="4" fill="#a78bfa"><title>Strength: ${r0(it.s)} kcal</title></rect>`:''}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${new Date(it.d+'T12:00:00').getDate()}</text>`; });
  const tot=items.reduce((a,b)=>a+b.g,0); return `<h4 style="display:flex;justify-content:space-between"><span>🔥 Calories burned — last ${n} days</span><span style="color:#fdba74">${r0(tot)} kcal · avg ${r0(tot/n)}/day</span></h4><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:#a78bfa"></i>Strength training</span><span><i style="background:#fb923c"></i>Cardio & circuits</span></div>`; }

// ---------- TRAINING: core math ----------
const jsq=s=>esc(JSON.stringify(s));
const fw=kg=>`${r1(showW(kg))} ${wU()}`;
const fmtDur=sec=>{ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; };
function exInfo(name){ const e=EXDB[name]; if(e) return {name,m:e[0],s:e[1],eq:e[2],type:e[3],cue:e[4],bwf:e[5]||0,time:!!e[6]}; const c=(S.customEx||[]).find(x=>x.name===name); if(c) return {name,m:c.m||[],s:c.s||[],eq:c.eq||'Other',type:c.type||'C',cue:c.cue||'',bwf:0,time:false,custom:true}; return {name,m:[],s:[],eq:'Other',type:'C',cue:'',bwf:0,time:false}; }
function allExNames(){ return [...new Set([...Object.keys(EXDB), ...(S.customEx||[]).map(c=>c.name), ...Object.values(S.log).flatMap(d=>(d.sets||[]).map(s=>s.ex))])]; }
function exDatalist(){ return `<datalist id="exlist">${allExNames().sort().map(e=>`<option value="${esc(e)}">`).join('')}</datalist>`; }
// Bodyweight lifts (pull-ups, dips, push-ups) include your bodyweight × the fraction actually lifted
function setLoad(s){ return (s.w||0)+exInfo(s.ex).bwf*currentWeight(); }
function setE1(s){ const x=exInfo(s.ex); if(x.time||s.warm) return 0; return e1rm(setLoad(s), s.r, s.rpe); }
function setVol(s){ const x=exInfo(s.ex); if(x.time||s.warm) return 0; return setLoad(s)*s.r; }
function allSetsOf(ex){ const out=[]; for(const [d,L] of Object.entries(S.log)) for(const s of L.sets||[]) if(s.ex===ex) out.push({...s,date:d}); return out; }
function liftHistory(ex){ const x=exInfo(ex); const out=[]; for(const d of Object.keys(S.log).sort()){ const sets=(S.log[d].sets||[]).filter(s=>s.ex===ex&&!s.warm); if(sets.length) out.push({date:d, best:x.time?Math.max(...sets.map(s=>s.r)):Math.max(...sets.map(setE1)), top:Math.max(...sets.map(s=>s.w||0)), vol:sets.reduce((a,s)=>a+setVol(s),0), sets}); } return out; }
function prBefore(ex,date){ let best=0; for(const d of Object.keys(S.log)){ if(d>=date) continue; for(const s of S.log[d].sets||[]) if(s.ex===ex) best=Math.max(best,setE1(s)); } return best; }
function lastPerf(ex){ for(const d of Object.keys(S.log).sort().reverse()){ const ss=(S.log[d].sets||[]).filter(s=>s.ex===ex&&!s.warm); if(ss.length) return {date:d,sets:ss}; } return null; }
function exRecords(ex){ const r={e1:null,heavy:null,maxR:null,vol:null,rep:{}}; for(const s of allSetsOf(ex).filter(s=>!s.warm)){ const e=setE1(s); if(!r.e1||e>r.e1.v) r.e1={v:e,date:s.date,s};
  if(!r.heavy||s.w>r.heavy.s.w||(s.w===r.heavy.s.w&&s.r>r.heavy.s.r)) r.heavy={date:s.date,s}; if(!r.maxR||s.r>r.maxR.s.r) r.maxR={date:s.date,s};
  for(const k of [1,3,5,8,10,12]) if(s.r>=k&&(!r.rep[k]||s.w>r.rep[k].w)) r.rep[k]={w:s.w,date:s.date}; }
  const h=liftHistory(ex); for(const d of h) if(!r.vol||d.vol>r.vol.v) r.vol={v:d.vol,date:d.date}; r.sessions=h.length; return r; }
// Plate-friendly increment for progressive overload
function incKg(ex){ const x=exInfo(ex); const lower=x.type==='C'&&x.m.some(m=>['Quads','Glutes','Hamstrings'].includes(m)); if(imp()) return readW(x.eq==='Dumbbell'?5:(lower||x.eq==='Machine')?10:5); return x.eq==='Dumbbell'?2:(lower||x.eq==='Machine')?5:2.5; }
function roundKg(kg){ const st=imp()?5:2.5; return readW(Math.round(showW(kg)/st)*st); }
// Double progression: hit the top of the rep range on every working set → add load
function suggest(ex,lo,hi){ const x=exInfo(ex); const lp=lastPerf(ex);
  if(!lp&&x.eq==='Bodyweight'&&!x.time) return {w:0,msg:`First time: do clean reps with full range, stopping 1–3 reps short of failure. Too easy? Use a harder variation.`};
  if(!lp) return {w:null,msg:x.time?'First time: hold with perfect form, stop 5–10 s before failure.':'First time here: pick a weight you could lift for 2–3 more reps than the target (RPE 7–8).'};
  if(x.time){ const b=Math.max(...lp.sets.map(s=>s.r)); return {w:lp.sets[0].w||0,msg:`Last best: ${b} s. Aim for ${b+5}–${b+10} s.`}; }
  const top=Math.max(...lp.sets.map(s=>s.w||0)); const work=lp.sets.filter(s=>(s.w||0)>=top*0.97); const minR=Math.min(...work.map(s=>s.r)); const rp=work.filter(s=>s.rpe); const avgRpe=rp.length?rp.reduce((a,s)=>a+s.rpe,0)/rp.length:null; const inc=incKg(ex);
  if(top===0&&(x.eq==='Bodyweight'||x.bwf)){ if(minR>=hi) return {w:0,up:true,msg:`↑ You hit ${hi}+ reps on every set — progress to a harder variation, slow the tempo (3 s down), or add load.`}; return {w:0,msg:`Beat last time's reps (${work.map(s=>s.r).join(', ')}). Progress once every set reaches ${hi}.`}; }
  if(minR>=hi && !(avgRpe>=9.5)){ const nw=exInfo(ex).eq==='Dumbbell'&&!imp()?top+inc:Math.max(roundKg(top+inc),top+inc*0.5); return {w:nw,up:true,msg:`↑ Add weight: ${fw(nw)}. You hit ${hi}+ reps on every working set last time (${shortDate(lp.date)}).`}; }
  if(minR<lo && avgRpe>=9.5) return {w:roundKg(top*0.9),msg:`↓ Missed the rep target at max effort — drop ~10% to ${fw(roundKg(top*0.9))} and build back up.`};
  if(minR<lo) return {w:top,msg:`Repeat ${fw(top)} and aim for ${lo}+ reps on every set.`};
  return {w:top,msg:`Stay at ${fw(top)} and beat last time's reps (${work.map(s=>s.r).join(', ')}). Add weight once every set reaches ${hi}.`}; }
function defaultRange(ex){ const x=exInfo(ex); return x.time?[30,60]:x.type==='C'?[6,10]:[10,15]; }
function warmupScheme(wKg,eq){ const bar=imp()?readW(45):20; const st=imp()?readW(5):2.5; const rd=v=>Math.round(v/st)*st;
  if(eq==='Barbell'){ if(wKg<=bar*1.2) return []; const out=[[bar,10]]; for(const [p,r] of [[.4,5],[.6,3],[.8,2]]){ const v=rd(wKg*p); if(v>bar+st/2&&v<wKg-st/2&&!out.some(o=>Math.abs(o[0]-v)<0.1)) out.push([v,r]); } return out; }
  return [[rd(wKg*0.5),8],[rd(wKg*0.75),4]].filter(([v])=>v>0); }
function weekKey(d){ const dt=new Date(d+'T12:00:00'); return addDays(d,-((dt.getDay()+6)%7)); }
const isStrengthAct=a=>a.strength||/^Weight training/.test(a.name);
function trainedDay(L){ return (L.sets||[]).some(s=>!s.warm)||(L.acts||[]).length>0; }
function streakWeeks(){ const has=w=>{ for(let i=0;i<7;i++) if(trainedDay(peekDay(addDays(w,i)))) return true; return false; }; let wk=weekKey(TODAY()), n=0; if(!has(wk)) wk=addDays(wk,-7); while(has(wk)&&n<520){ n++; wk=addDays(wk,-7); } return n; }
function muscleSets(days=7){ const m={}; for(let i=0;i<days;i++) for(const s of peekDay(addDays(TODAY(),-i)).sets||[]){ if(s.warm) continue; const x=exInfo(s.ex); x.m.forEach(k=>m[k]=(m[k]||0)+1); x.s.forEach(k=>m[k]=(m[k]||0)+0.5); } return m; }
function cardioWeek(){ let mod=0,vig=0; for(let i=0;i<7;i++) for(const a of peekDay(addDays(TODAY(),-i)).acts||[]){ if(isStrengthAct(a)) continue; if(a.met>=6) vig+=a.min; else if(a.met>=3) mod+=a.min; } return {mod,vig,eq:mod+2*vig}; }
function heatmap(weeks=18){ const start=addDays(weekKey(TODAY()),-(weeks-1)*7), cs=14, gap=3; let g='';
  for(let w=0;w<weeks;w++) for(let d=0;d<7;d++){ const date=addDays(start,w*7+d); if(date>TODAY()) continue; const L=peekDay(date); const sets=(L.sets||[]).filter(s=>!s.warm).length; const cm=(L.acts||[]).filter(a=>!isStrengthAct(a)).reduce((a,b)=>a+b.min,0); const v=sets+cm/5;
    const col=v===0?'#1d212a':v<8?'#14532d':v<16?'#15803d':v<24?'#22c55e':'#4ade80'; g+=`<rect x="${32+w*(cs+gap)}" y="${d*(cs+gap)}" width="${cs}" height="${cs}" rx="3" fill="${col}" ${date===TODAY()?'stroke="#e9ecf2"':''}><title>${shortDate(date)}: ${sets} sets, ${r0(cm)} cardio min</title></rect>`; }
  ['Mon','','Wed','','Fri','','Sun'].forEach((l,i)=>g+=`<text x="0" y="${i*(cs+gap)+11}">${l}</text>`);
  return `<svg class="chart" viewBox="0 0 ${32+weeks*(cs+gap)} ${7*(cs+gap)}">${g}</svg>`; }

function tl(){ return UI.tl??={w:imp()?185:85,r:5,rpe:'',pe1:'',pt:imp()?225:100,bar:imp()?45:20,ww:imp()?225:100,age:S.profile.age,rhr:S.profile.restHR||60,mhr:'',dist:5,du:imp()?'mi':'km',hh:0,mm:imp()?45:28,ss:0,mode:'run',grade:0}; }

const tin=(k,label,w=80,step='any')=>`<label>${label}<input type="number" step="${step}" value="${tl()[k]}" style="width:${w}px" oninput="tv('${k}',this.value)"></label>`;
function platesFor(total,bar){ const P=imp()?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25]; let side=(total-bar)/2; const out=[]; if(side<0) return null; for(const p of P){ while(side>=p-1e-6){ out.push(p); side-=p; } } return {plates:out,rem:side}; }
const PCOL={45:'#3b82f6',25:'#ef4444',35:'#eab308',20:'#3b82f6',15:'#eab308',10:'#22c55e',5:'#e5e7eb',2.5:'#6b7280',1.25:'#9ca3af'};
function fmtMin(m){ return fmtDur(m*60); }
const TOOLS_OUT={
 orm(){ const t=tl(), w=+t.w, r=+t.r, rpe=+t.rpe||0; if(!(w>0&&r>0)) return '<div class="mut">Enter weight and reps.</div>'; const n=r+(rpe?clamp(10-rpe,0,5):0);
  const F=n<=1?[['All formulas',w]]:[['Epley',w*(1+n/30)],['Brzycki',n<37?w*36/(37-n):NaN],['Lombardi',w*Math.pow(n,0.1)],['Mayhew',100*w/(52.2+41.9*Math.exp(-0.055*n))],['Wathan',100*w/(48.8+53.8*Math.exp(-0.075*n))]]; const best=e1rm(w,r,rpe||null);
  return `<div class="stat" style="margin:8px 0"><span class="v" style="color:var(--acc)">${r1(best)} ${wU()}</span><span class="l">Forge e1RM (Epley/Brzycki mean${rpe?`, ${10-rpe} RIR added`:''})</span></div>
   <div class="row sm mut">${F.map(([k,v])=>`<span>${k}: <b style="color:var(--text)">${isNaN(v)?'—':r1(v)}</b></span>`).join(' · ')}</div>${n>12?'<div class="note w" style="margin-top:8px">Estimates get less reliable above ~12 reps.</div>':''}
   <table style="margin-top:10px"><tr><th>% 1RM</th><th class="r">Weight</th><th class="r">≈ Reps to failure</th></tr>${[100,95,90,85,80,75,70,65,60,50].map(p=>`<tr><td>${p}%</td><td class="r">${r1(best*p/100)}</td><td class="r">${p===100?1:Math.round(30*(100/p-1))}</td></tr>`).join('')}</table>`; },
 rpe(){ const e=+tl().pe1||0; const cols=[10,9.5,9,8.5,8,7.5,7,6.5,6];
  return `<div style="overflow:auto"><table><tr><th>Reps</th>${cols.map(c=>`<th class="r">@${c}</th>`).join('')}</tr>${[1,2,3,4,5,6,7,8,10,12].map(r=>`<tr><td class="b">${r}</td>${cols.map(c=>{ const p=1/e1rm(1,r,c); return `<td class="r">${e?r0(e*p):r0(p*100)+'%'}</td>`; }).join('')}</tr>`).join('')}</table></div><div class="tip">${e?`Weights for an e1RM of ${e} ${wU()}.`:'Values are % of 1RM. Enter your e1RM to see weights.'} RPE 10 = no reps left, 9 = 1 rep left, 8 = 2 left…</div>`; },
 plate(){ const t=tl(); const res=platesFor(+t.pt,+t.bar); if(!res) return '<div class="mut">Target is lighter than the bar.</div>'; const max=imp()?45:25;
  const vis=res.plates.map(p=>{ const h=40+60*p/max; return `<div title="${p}" style="width:${p>=10?18:12}px;height:${h}px;background:${PCOL[p]};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#000;writing-mode:vertical-rl">${p}</div>`; }).join('');
  return `<div style="display:flex;align-items:center;gap:2px;margin:12px 0;height:110px"><div style="width:60px;height:10px;background:#9ca3af;border-radius:2px"></div><div style="width:8px;height:30px;background:#9ca3af"></div>${vis}<div style="width:30px;height:10px;background:#9ca3af;border-radius:0 2px 2px 0"></div></div>
   <div><b>Per side:</b> ${res.plates.length?res.plates.join(' + '):'nothing — just the bar'}</div>${res.rem>0.01?`<div class="note w" style="margin-top:8px">Can't load exactly — closest is ${r1(+t.pt-res.rem*2)} ${wU()}.</div>`:''}`; },
 warm(){ const t=tl(); const w=+t.ww, bar=+t.bar; if(!(w>0)) return ''; const st=imp()?5:2.5; const rd=v=>Math.round(v/st)*st; const rows=[[bar,10,'Empty bar']]; for(const [p,r] of [[.4,5],[.6,3],[.8,2]]){ const v=rd(w*p); if(v>bar&&v<w&&!rows.some(o=>o[0]===v)) rows.push([v,r,Math.round(p*100)+'%']); } rows.push([w,'work','Working sets']);
  return `<table><tr><th>Set</th><th class="r">Weight</th><th class="r">Reps</th><th>Plates / side</th></tr>${rows.map((x,i)=>{ const pl=platesFor(x[0],bar); return `<tr><td>${x[2]}</td><td class="r b">${r1(x[0])}</td><td class="r">${x[1]}</td><td class="mut sm">${pl&&pl.plates.length?pl.plates.join(' + '):'—'}</td></tr>`; }).join('')}</table><div class="tip">Rest ~1 min between warm-ups. Warm-ups are excluded from volume and PRs.</div>`; },
 hr(){ const t=tl(); const age=+t.age||30, rhr=+t.rhr||60; const mhr=+t.mhr||Math.round(208-0.7*age); const Z=[['Zone 1 · Recovery',.5,.6,'#60a5fa'],['Zone 2 · Aerobic base',.6,.7,'#22c55e'],['Zone 3 · Tempo',.7,.8,'#eab308'],['Zone 4 · Threshold',.8,.9,'#fb923c'],['Zone 5 · VO₂max',.9,1,'#ef4444']];
  return `<div class="row sm mut" style="margin:6px 0">Max HR ${mhr} bpm ${t.mhr?'(measured)':`(Tanaka: 208 − 0.7 × age; the old 220 − age gives ${220-age})`} · HR reserve ${mhr-rhr}</div>
   ${Z.map(([n,a,b,c])=>`<div style="margin-bottom:6px"><div class="row sp sm"><span><b style="color:${c}">${n}</b> <span class="mut">${a*100}–${b*100}%</span></span><b>${Math.round(rhr+a*(mhr-rhr))}–${Math.round(rhr+b*(mhr-rhr))} bpm</b></div><div class="bar"><i style="width:${b*100}%;background:${c}"></i></div></div>`).join('')}
   <div class="tip">Karvonen (heart-rate reserve) method. Most endurance volume (~80%) belongs in zones 1–2.</div>`; },
 pace(){ const t=tl(); const dm=(+t.dist)*(t.du==='mi'?1609.344:1000); const min=(+t.hh)*60+(+t.mm)+(+t.ss)/60; if(!(dm>0&&min>0)) return '<div class="mut">Enter distance and time.</div>';
  const v=dm/min, g=(+t.grade||0)/100; const vo2=t.mode==='walk'?0.1*v+1.8*v*g+3.5:0.2*v+0.9*v*g+3.5; const met=vo2/3.5; const kg=currentWeight(); const rmr=bmrInfo(kg).bmr/1440/5*1000/kg;
  const gross=vo2*kg*min*0.005, net=Math.max(0,vo2-rmr)*kg*min*0.005; const kmh=v*60/1000;
  let warn=''; if(t.mode==='walk'&&(v<50||v>100)) warn='The ACSM walking equation is validated for 1.9–3.7 mph (3–6 km/h).'; if(t.mode==='run'&&v<134) warn='The ACSM running equation is validated above 5 mph (8 km/h); at this pace consider the walking mode.';
  let vd=''; if(t.mode==='run'&&dm>=1500&&min>=3.5&&g===0){ const vo=-4.60+0.182258*v+0.000104*v*v; const pct=0.8+0.1894393*Math.exp(-0.012778*min)+0.2989558*Math.exp(-0.1932605*min); const vdot=vo/pct;
   vd=`<h4>Race fitness</h4><div class="stats"><div class="stat"><span class="v">${r1(vdot)}</span><span class="l">VDOT (≈ VO₂max)</span></div>${[['5K',5000],['10K',10000],['Half',21097.5],['Marathon',42195]].map(([n,d])=>`<div class="stat"><span class="v" style="font-size:17px">${fmtMin(min*Math.pow(d/dm,1.06))}</span><span class="l">${n} prediction</span></div>`).join('')}</div><button class="btn g s" style="margin-top:8px" onclick="S.profile.vo2max=${r1(vdot)};save();toast('VO₂max saved to your profile — calorie estimates now use it')">Use ${r1(vdot)} as my VO₂max</button><div class="tip">VDOT from Daniels & Gilbert; predictions via Riegel's formula (T₂ = T₁ × (D₂/D₁)^1.06) — assume equal training for the distance.</div>`; }
  UI._pace={name:`${t.mode==='walk'?'Walk':'Run'} ${t.dist} ${t.du} in ${fmtMin(min)}${g?` @ ${t.grade}% grade`:''}`,met:r1(met),min:r1(min),net,gross};
  return `<div class="stats" style="margin-top:8px"><div class="stat"><span class="v">${fmtMin(min/(dm/1000))}</span><span class="l">per km</span></div><div class="stat"><span class="v">${fmtMin(min/(dm/1609.344))}</span><span class="l">per mile</span></div><div class="stat"><span class="v">${r1(kmh)}</span><span class="l">km/h · ${r1(kmh/1.609)} mph</span></div><div class="stat"><span class="v">${r1(met)}</span><span class="l">METs (${r1(vo2)} ml/kg/min)</span></div><div class="stat"><span class="v" style="color:var(--acc)">${r0(net)}</span><span class="l">kcal net (${r0(gross)} gross)</span></div></div>

};

function fmtG(g){ return imp() ? (g>=454? r1(g/453.6)+' lb' : r1(g/28.35)+' oz')+` (${r0(g)} g)` : (g>=1000? r1(g/1000)+' kg':r0(g)+' g'); }

   <div class="mrow" style="grid-template-columns:repeat(3,1fr)">
    <div><b>${r0(T.kcal)}</b><span>kcal</span></div><div><b style="color:var(--p)">${r0(T.protein)} g</b><span>protein</span></div><div><b style="color:var(--c)">${r0(T.carbs)} g</b><span>carbs</span></div>
    <div><b style="color:var(--f)">${r0(T.fat)} g</b><span>fat</span></div><div><b style="color:var(--fib)">${r0(T.fiber)} g</b><span>fiber</span></div><div><b style="color:var(--water)">${imp()?r0(T.water/29.57)+' oz':r1(T.water/1000)+' L'}</b><span>water</span></div>
   </div>
   ${T.floored?`<div class="note w" style="margin-top:10px">Target capped at the minimum of ${r0(T.kcal)} kcal. Your chosen rate would require ${r0(T.tdee+T.delta)} kcal.</div>`:''}
   <h3 style="margin-top:16px">Data</h3>
   <div class="row"><button class="btn g" onclick="exportData()">⬇ Export backup</button><label class="btn g" style="flex-direction:row;color:var(--text);font-size:14px">⬆ Import<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn g" onclick="loadDemo()">Load demo data</button><button class="btn d" onclick="resetAll()">Reset all</button></div>
   <div class="tip">All data is stored only in this browser. Export regularly to keep a backup.</div>
  </div></div>
  <div class="card" style="margin-top:14px"><h3>How Forge calculates things</h3><div class="mut" style="columns:2 300px;column-gap:28px">
   <p><b>BMR</b>: Mifflin-St Jeor (most accurate predictive equation in validation studies), or Katch-McArdle when body fat is known.</p>
   <p><b>Adaptive TDEE</b>: average logged intake − (regression slope of weight × 7,700 kcal/kg) across the last 28 days. Self-corrects for logging bias and individual metabolism.</p>
   <p><b>Weight trend</b>: gap-aware exponential moving average (10%/day) to filter water fluctuations; weekly rate via linear regression.</p>
   <p><b>Exercise</b>: Compendium MET values. Net kcal = (MET×3.5 − your own resting VO₂) × kg × min × 0.005, so resting burn isn't double counted.</p>
   <p><b>Strength</b>: e1RM = mean of Epley & Brzycki (≤10 reps), with RPE converted to reps-in-reserve.</p>
   <p><b>Body fat</b>: U.S. Navy circumference equations. <b>Nutrition</b>: USDA FoodData Central values per 100 g; recipes summed by ingredient weight.</p>
   <p class="sm">Forge is an educational tool, not medical advice. Consult a professional for medical conditions, pregnancy, or eating disorders.</p>
  </div></div>
  ${burnProfileHTML()}
  ${snapSettingsHTML()}
  ${appStatusHTML()}
  <details class="card" style="margin-top:14px"><summary>Photo credits</summary><div class="credits">${[...new Map(Object.values(PHOTOS).map(p=>[p.u,p])).values()].map(p=>`<div><a href="${p.page}" target="_blank" rel="noopener">${esc(p.t.replace(/\.jpe?g$/i,''))}</a> — ${esc(p.by)} · ${esc(p.lic)}</div>`).join('')}</div><div class="tip">Photos from Wikimedia Commons under the licenses listed. They load from the internet; offline, emoji placeholders are shown instead.</div></details>`;
}
function setP(k,v){ S.profile[k]=v; save(); render(); }
function setH(){ const ft=+$('#hft').value||0, inch=+$('#hin').value||0; S.profile.heightCm=(ft*12+inch)*2.54; save(); render(); }
function exportData(){ if(ANDROID){ ForgeAndroid.saveBackup(JSON.stringify(S,null,1),`forge-backup-${TODAY()}.json`); return; } const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`forge-backup-${TODAY()}.json`; a.click(); }
function importData(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.profile) throw 0; S={...structuredClone(DEFAULT),...d,profile:{...DEFAULT.profile,...d.profile}}; migrate(); save(); toast('Imported'); render(); }catch(e){ toast('Invalid backup file'); } }; r.readAsText(file); }
async function resetAll(){ if(await askConfirm('All food, workouts, weights and settings will be erased. Export a backup first if you might want them.',{title:'Delete ALL data?',ok:'Delete everything',danger:true})){ localStorage.removeItem(KEY); S=structuredClone(DEFAULT); render(); } }
async function loadDemo(){
  if((S.weights.length||Object.keys(S.log).length) && !await askConfirm('Your current data will be replaced. Export a backup first if you want to keep it.',{title:'Load demo data?',ok:'Replace with demo',danger:true})) return;
  S=structuredClone(DEFAULT); let w=70.5; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const meals=[['r2','Breakfast',1],['r11','Lunch',1],['r4','Dinner',1],['r15','Snacks',1],['r1','Breakfast',1],['r6','Dinner',1.5],['r5','Lunch',1],['r12','Snacks',1],['r9','Dinner',1],['r7','Dinner',1]];
  for(let i=40;i>=1;i--){ const d=addDays(TODAY(),-i); const L={food:[],water:1500+r0(rnd()*1200),acts:[],sets:[]};
    w += -0.03 + (rnd()-0.5)*0.12; S.weights.push({date:d,kg:r1(w + (rnd()-0.5)*0.9)});
    if(i%7!==3){ const pick=[0,1,2,3].map(j=>meals[(i+j*3)%meals.length]); for(const[id,meal,s] of pick){ const r=recipeById(id),per=recipePer(r); L.food.push({kcal:per.kcal*s,p:per.p*s,c:per.c*s,f:per.f*s,fib:per.fib*s,name:r.name,amt:`${s} serving`,ref:'recipe:'+id,meal}); } const f=foodById('apple'); L.food.push({...foodMacros(f,182),name:f.name,amt:'1 × medium',ref:'food:apple',meal:'Snacks'}); }
    if(i%2===0){ const wk=Math.floor((40-i)/7); const plan=i%4===0?[['Back Squat',60+wk*2.5],['Bench Press',40+wk*1.25],['Barbell Row',40+wk*1.25]]:[['Deadlift',80+wk*2.5],['Overhead Press',27.5+wk],['Lat Pulldown',45+wk*1.25]];
      for(const[ex,kg] of plan) for(let s=0;s<3;s++) L.sets.push({ex,w:roundKg(kg),r:[8,8,7][s],rpe:[7,8,8.5][s],kg:true});
      const e=actKcal(6.0,50,w); L.acts.push({name:'Weight training, vigorous effort',met:6,min:50,net:e.net,gross:e.gross,strength:true}); L.wos=[{name:i%4===0?'Squat / Bench / Row':'Deadlift / Press / Pulldown',dur:50,sets:9,vol:L.sets.reduce((a,s)=>a+setVol(s),0),prs:[],kcal:e.gross,net:e.net}]; }
    else if(i%3===0){ const e=actKcal(9.8,30,w); L.acts.push({name:'Running, 6 mph (10:00 /mi)',met:9.8,min:30,net:e.net,gross:e.gross}); }
    S.log[d]=L; }
  S.measures.push({id:uid(),date:addDays(TODAY(),-35),waist:79,neck:33,hip:102,bf:navyBF('female',168,79,33,102)},{id:uid(),date:addDays(TODAY(),-7),waist:76.5,neck:33,hip:100.5,bf:navyBF('female',168,76.5,33,100.5)});
  S.shopping=[{id:'r6',serv:6},{id:'r1',serv:3}];
  S.progNext={fb3:1}; S.profile.weightKg=currentWeight(); save(); UI.date=TODAY(); toast('Demo data loaded'); render();
}

// keep recipe search focus after re-render
const _render=render; render=function(){ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart; _render(); if(id==='rq'||id==='fq'||id==='lq'){ const e=document.getElementById(id); if(e){ e.focus(); try{e.setSelectionRange(pos,pos);}catch(_){} } } };
function migrate(){ for(const L of Object.values(S.log)) for(const s of L.sets||[]) if(!s.kg){ s.w=readW(s.w||0); s.kg=true; } S.customEx??=[]; S.templates??=[]; S.progNext??={}; }
migrate();
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter' && e.target.id==='sr') addSet(); });
// ---------- App install & offline ----------
window.forgeBack=function(){
  const dlg=document.querySelector('.dlg'); if(dlg){ dlg.click(); return true; }
  if($('#modal').innerHTML){ closeModal(); return true; }
  if(UI.sel){ UI.sel=null; render(); return true; }
  if(UI.tab==='train'&&UI.tsub&&UI.tsub!=='log'&&UI.tsub!=='workout'){ UI.tsub='log'; render(); return true; }
  if(UI.tab!=='today'){ go('today'); return true; }
  return false; };
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function updateInstallBtn(){ const b=$('#installBtn'); if(b) b.style.display=(ANDROID||isStandalone())?'none':''; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; updateInstallBtn(); if(UI.tab==='profile') render(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; updateInstallBtn(); toast('✅ Forge installed — open it from your apps'); if(UI.tab==='profile') render(); });
async function installApp(){
  if(deferredInstall){ deferredInstall.prompt(); const r=await deferredInstall.userChoice; deferredInstall=null; updateInstallBtn(); if(r.outcome==='accepted') toast('Installing Forge…'); return; }
  if(isIOS()) return ask({title:'Install on iPhone / iPad',msg:'In Safari, tap the Share button (square with an arrow), then "Add to Home Screen".',ok:'Got it',cancel:'Close'});
  ask({title:'Install Forge',msg:'In Chrome or Edge, open the browser menu (⋮) and choose "Install Forge" or "Apps → Install this site as an app". On Android, choose "Add to Home screen".',ok:'Got it',cancel:'Close'}); }
function burnProfileHTML(){ const p=S.profile, kg=currentWeight(), b=bmrInfo(kg); const maxHR=Math.round(208-0.7*(+p.age||30)); const rhr=+p.restHR||null;
  const rows=[['Brisk walk (3.5 mph)',4.3],['Easy cycling (12–14 mph)',8.0],['Running 6 mph (10:00/mi)',9.8],['Weight training, moderate',3.5],['Weight training, vigorous',6.0],['HIIT / circuit (vigorous)',8.0],['Yoga (hatha)',2.5],['Swimming laps, moderate',5.8]];
  const hrRows=rhr?[['Zone 2 (easy)',Math.round(rhr+0.65*(maxHR-rhr))],['Zone 3 (tempo)',Math.round(rhr+0.75*(maxHR-rhr))],['Zone 4 (hard)',Math.round(rhr+0.85*(maxHR-rhr))]]:[];
  return `<div class="card" style="margin-top:14px"><h3>🔥 Your calorie-burn profile <small>${esc(profileTag())}</small></h3>
   <div class="stats"><div class="stat"><span class="v">${r0(b.bmr)}</span><span class="l">Resting burn / day</span></div><div class="stat"><span class="v">${r1(b.bmr/1440)}</span><span class="l">kcal / min at rest</span></div><div class="stat"><span class="v">${maxHR}</span><span class="l">Est. max HR</span></div><div class="stat"><span class="v">${p.vo2max||'—'}</span><span class="l">VO₂max</span></div></div>
   <h4>What 30 minutes burns for you</h4><div style="overflow:auto"><table><tr><th>Activity</th><th class="r">METs</th><th class="r">Total burn</th><th class="r">Above resting</th></tr>${rows.map(([n,m])=>{ const e=burn(m,30); return `<tr><td>${n}</td><td class="r">${m}</td><td class="r b" style="color:#fdba74">${r0(e.gross)} kcal</td><td class="r">${r0(e.net)} kcal</td></tr>`; }).join('')}
   ${hrRows.map(([n,h])=>{ const e=burn(0,30,h); return `<tr><td>${n} — ${h} bpm <span class="pill">HR method</span></td><td class="r">—</td><td class="r b" style="color:#fdba74">${r0(e.gross)} kcal</td><td class="r">${r0(e.net)} kcal</td></tr>`; }).join('')}</table></div>
   <div class="tip">How it's personalised: activity METs (Compendium of Physical Activities) × <b>your weight</b>; resting burn from <b>your age, sex, height${p.bodyFat?' and body fat':''}</b> (${b.method}) is subtracted for the "above resting" figure your food budget uses. When you enter an average heart rate, Forge switches to the <b>Keytel heart-rate equation</b> using your HR, age, sex, weight${p.vo2max?' and VO₂max':''} — generally the most accurate option without a lab. ${rhr?'':'Add your resting heart rate above to see heart-rate-zone burns.'} ${p.vo2max?'':'Add a VO₂max (watch, lab, or Tools → Run calculator) to sharpen heart-rate estimates further.'}</div></div>`; }
function appStatusHTML(){ if(ANDROID) return `<div class="card" style="margin-top:14px"><h3>📱 Forge for Android <small>version ${ForgeAndroid.version()}</small></h3><div class="row"><span class="pill on">✓ Installed app</span><span class="pill on">✓ Works offline</span><span class="pill on">✓ Screen stays on during workouts</span></div><div class="tip">Your data is stored privately on this phone and included in Android's device backup. Use Export backup to keep a copy or move it to another device.</div></div>`; const sw='serviceWorker' in navigator; return `<div class="card" style="margin-top:14px"><h3>📲 Forge app <small>${isStandalone()?'running as an installed app':'running in the browser'}</small></h3>
  <div class="row">${isStandalone()?'<span class="pill on">✓ Installed</span>':`<button class="btn" onclick="installApp()">⬇ Install Forge</button>`}<span class="pill ${sw&&navigator.serviceWorker.controller?'on':''}">${sw&&navigator.serviceWorker.controller?'✓ Works offline':'Offline mode activates after first load'}</span><span class="pill ${UI._persist?'on':''}">${UI._persist?'✓ Storage protected':'Storage: standard'}</span></div>
  <div class="tip">Installed, Forge opens in its own window with an icon on your desktop, Start menu or home screen, and works without internet — your data stays on this device. Photos are saved for offline use once you've viewed them. Long-press the icon for shortcuts (Log food, Start a workout, Recipes).</div></div>`; }
if(!ANDROID && 'serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{ reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='activated'&&navigator.serviceWorker.controller) toast('✨ Forge updated'); }); }); }).catch(()=>{});
}
navigator.storage?.persist?.().then(v=>{ UI._persist=v; }).catch(()=>{});
render(); updateInstallBtn();
</script>
